<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도형 편집기 · 수학 문제 그림 만들기</title>
<!--
  ┌──────────────────────────────────────────────────────────────┐
  │  도형 편집기 (4단계)                                            │
  │  이 파일 하나만 더블클릭하면 브라우저에서 바로 실행됩니다.          │
  │  인터넷 연결·서버·설치가 필요 없습니다.                            │
  │                                                              │
  │  파일 구성 (Claude Code가 수정할 때 찾기 쉽도록 구역을 나눴습니다)  │
  │   1. <style>  : 화면 디자인(색, 크기, 버튼 모양)                   │
  │   2. <body>   : 화면 뼈대(상단 바, 도구 모음, 작업 영역, 속성창)      │
  │   3. <script> : 동작. [설정] 구역의 CONFIG 값만 바꿔도               │
  │                 점 크기·선 굵기·기본 색 등이 전체에 적용됩니다.       │
  │                 [도구 목록] TOOLS 에서 왼쪽 도구 버튼을 정합니다.      │
  └──────────────────────────────────────────────────────────────┘
-->
<style>
/* ================================================================
   [디자인] 색상 테마 — 여기 색을 바꾸면 전체 분위기가 바뀝니다.
   ================================================================ */
:root{
  --bg:#eef1f7;          /* 바탕 */
  --panel:#ffffff;       /* 패널 */
  --line:#e2e7f0;        /* 테두리 */
  --line-strong:#cfd6e4;
  --text:#28324a;        /* 글자 */
  --muted:#7c879c;       /* 흐린 글자 */
  --accent:#5b7cfa;      /* 강조(파랑) */
  --accent-dark:#3f5fe0;
  --accent-soft:#eaefff;
  --orange:#f59f3a;
  --orange-soft:#fff5e8;
  --danger:#e5484d;
  --danger-soft:#fdeeee;
  --green:#2fa36b;
  --r:14px;
  --shadow:0 1px 2px rgba(30,40,70,.06),0 4px 14px rgba(30,40,70,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;overflow:hidden;min-width:1000px;
  background:var(--bg);color:var(--text);
  font:14px/1.45 "Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 상단 바 ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;margin-right:6px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#86a0ff,#5b7cfa);display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(91,124,250,.35)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:-2px}
.tb-group{display:flex;gap:3px;padding:0 8px;border-left:1px solid var(--line)}
.tb-btn{display:flex;align-items:center;gap:6px;padding:8px 11px;border:none;border-radius:10px;background:transparent;white-space:nowrap;font-weight:600}
.tb-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent-dark)}
.tb-btn:disabled{opacity:.35}
.tb-btn.primary{background:var(--accent);color:#fff;padding:9px 15px;box-shadow:0 2px 6px rgba(91,124,250,.35)}
.tb-btn.primary:hover{background:var(--accent-dark);color:#fff}
.spacer{flex:1}
.work-info{display:flex;flex-direction:column;align-items:flex-end;margin-right:10px;min-width:0;max-width:240px}
#workTitle{border:none;background:none;padding:0 2px;font-weight:800;font-size:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1.5px dashed transparent}
#workTitle:hover{border-bottom-color:var(--accent);color:var(--accent-dark)}
.save-state{font-size:11.5px;font-weight:700}
.save-state.saved{color:var(--green)}
.save-state.unsaved{color:#c27311}
.multi-kinds{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.multi-kinds span{background:#f0f3f9;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;color:#45506a}
.group-title{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:12px;font-weight:800;color:var(--accent-dark);letter-spacing:.02em}
.group-title::after{content:'';flex:1;height:1px;background:var(--line)}
.default-row{display:flex;gap:6px;margin:4px 0 6px}
.default-row .small-btn{font-size:12px}

/* ---------- 3단 레이아웃 ---------- */
.main{flex:1;display:grid;grid-template-columns:156px 1fr 300px;gap:12px;padding:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:0}

/* ---------- 왼쪽: 도구 모음 ---------- */
.tools{display:flex;flex-direction:column;gap:6px;padding:10px;overflow:auto}
.section-title{font-size:12px;font-weight:700;color:var(--muted);padding:2px 4px}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.tool-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 7px;border:2px solid var(--line);border-radius:12px;background:#fafbfe;font-weight:700;font-size:13.5px;transition:background .12s,border-color .12s}
.tool-btn svg.ic{width:26px;height:26px}
.tool-btn .key{position:absolute;top:3px;right:6px;font-size:10px;font-weight:700;color:#a3adc0}
.tool-btn:hover{border-color:#b9c7fb;background:var(--accent-soft)}
.tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(91,124,250,.42)}
.tool-btn.active .key{color:#dbe3ff}
.shortcuts{margin-top:auto;padding:10px 4px 2px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.9}
kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;background:#fff;font:11px/16px inherit;text-align:center;color:var(--text)}

/* ---------- 가운데: 작업 영역 ---------- */
.stage{display:flex;flex-direction:column;overflow:hidden}
.canvas-wrap{position:relative;flex:1;min-height:0;background-color:#f4f6fb;background-image:radial-gradient(#d9dfeb 1px,transparent 1px);background-size:18px 18px;border-radius:var(--r) var(--r) 0 0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair}
#board .paper{fill:#fff;filter:drop-shadow(0 2px 8px rgba(30,40,70,.16))}
#board.tool-select{cursor:default}
#board.tool-select .obj{cursor:pointer}
#board.tool-select .obj.point,#board.tool-select .obj.text,#board.tool-select .obj.length,
#board.tool-select .obj.image.unlocked{cursor:move}
#board.tool-select .obj.angle,#board.tool-select .obj.right,#board.tool-select .obj.perp{cursor:nwse-resize}
#board.tool-select .obj.image.locked{cursor:default}
#board.tool-text{cursor:text}
#board.tool-text .obj.text{cursor:move}
#board .is-hidden{opacity:.28}
#board .overlay{pointer-events:none}
#board .overlay .handle{pointer-events:all}
.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;line-height:1.8}
.empty-hint b{display:block;font-size:17px;color:var(--text);margin-bottom:4px}
.drop-cover{position:absolute;inset:10px;border:3px dashed var(--accent);border-radius:16px;background:rgba(91,124,250,.08);display:none;place-items:center;font-size:18px;font-weight:800;color:var(--accent-dark);pointer-events:none}
.canvas-wrap.dragover .drop-cover{display:grid}
.statusbar{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-top:1px solid var(--line);font-size:13px;min-height:44px}
.zoom{flex:none;display:flex;align-items:center;gap:2px;padding:2px;background:#f0f3f9;border-radius:10px}
.zoom button{border:none;background:transparent;border-radius:8px;padding:4px 9px;font-weight:700;color:#45506a;white-space:nowrap}
.zoom button:hover{background:#fff;color:var(--accent-dark)}
.zoom .pct{min-width:50px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.canvas-wrap.panning,.canvas-wrap.panning #board{cursor:grab !important}
.tool-btn.wide{grid-column:span 2;flex-direction:row;justify-content:center;gap:5px;padding:9px 4px;white-space:nowrap;font-size:13.5px}
.tool-btn.wide svg.ic{width:20px;height:20px}
.tool-btn.wide .pill{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:#e6eaf2;color:var(--muted)}
.tool-btn.wide.on{border-color:var(--green);background:#ecf8f2;color:#1d7a52}
.tool-btn.wide.on .pill{background:var(--green);color:#fff}
.coord-xy{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:6px 8px;font-family:"Times New Roman",serif;font-style:italic;font-size:17px}
.tool-chip{flex:none;background:var(--accent);color:#fff;font-weight:700;padding:3px 11px;border-radius:999px}
.hint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint.warn{color:#b86b00;font-weight:600}
.hint .step{display:inline-block;background:var(--orange-soft);color:#a35d00;font-weight:800;border-radius:6px;padding:0 7px;margin-right:6px}
.coords{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 오른쪽: 속성창 ---------- */
.props{display:flex;flex-direction:column;overflow:hidden}
.props-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line)}
.props-head .badge{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);flex:none}
.props-head .t1{font-weight:800;font-size:15px}
.props-head .t2{font-size:12px;color:var(--muted)}
.props-body{flex:1;overflow:auto;padding:14px 15px}
.field{margin-bottom:15px}
.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.props input[type=text],.props input[type=number],.modal input[type=text]{width:100%;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:9px;font:inherit;background:#fff;color:var(--text)}
.modal input[type=text]{font-size:17px;padding:10px 12px}
.props input:focus,.modal input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.props input:disabled{background:#f3f5f9;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{min-width:28px;border:1px solid var(--line-strong);background:#fff;border-radius:7px;padding:1px 8px;font-family:"Times New Roman",serif;font-size:15px}
.chip.it{font-style:italic}
.chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;accent-color:var(--accent)}
.slider-val{min-width:46px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sw{width:25px;height:25px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line-strong);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
.swatches input[type=color]{width:32px;height:28px;padding:0;border:none;background:none;cursor:pointer}
.seg{display:flex;gap:2px;padding:3px;background:#f0f3f9;border-radius:10px}
.seg button{flex:1;padding:7px 4px;border:none;border-radius:8px;background:transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--accent-dark);box-shadow:0 1px 4px rgba(30,40,70,.14)}
.dir-grid{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.dir-grid button{height:30px;border:1.5px solid var(--line-strong);border-radius:8px;background:#fff;font-size:14px;font-weight:700;color:var(--muted);padding:0}
.dir-grid button:hover{border-color:var(--accent);color:var(--accent-dark)}
.dir-grid button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dir-grid button:nth-child(5){font-size:11.5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;margin-bottom:4px;cursor:pointer;font-weight:600}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:#cfd6e4;transition:.15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:21px}
.big-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;margin-bottom:14px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff;font-weight:700}
.big-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-dark)}
.big-btn.lock-on{background:var(--orange-soft);border-color:#f8c98c;color:#a35d00}
.big-btn.accent{background:var(--accent-soft);border-color:#c5d2fd;color:var(--accent-dark)}
.big-btn.danger{background:var(--danger-soft);border-color:#f3c3c4;color:var(--danger);margin:6px 0 0}
.big-btn:disabled{opacity:.45}
.btn-row{display:flex;gap:6px;margin-bottom:15px}
.small-btn{flex:1;padding:8px 4px;border:1.5px solid var(--line-strong);border-radius:9px;background:#fff;font-size:12.5px;font-weight:600}
.small-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-dark)}
.small-btn:disabled{opacity:.45}
.wh{display:flex;align-items:center;gap:6px;color:var(--muted)}
.note{font-size:12.5px;color:#a35d00;background:var(--orange-soft);border-radius:9px;padding:8px 10px;margin:-6px 0 14px}
.info{font-size:12.5px;color:var(--muted);background:#f5f7fb;border-radius:9px;padding:8px 10px;margin-bottom:15px}
.guide h4{margin:2px 0 10px;font-size:14px}
.guide ol{margin:0;padding-left:20px;line-height:1.85;color:#45506a}
.guide .tip{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-size:12.5px;line-height:1.7}
.list-wrap{border-top:1px solid var(--line);max-height:30%;display:flex;flex-direction:column}
.list-wrap .section-title{padding:10px 15px 4px}
.obj-list{overflow:auto;padding:2px 8px 10px}
.list-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;cursor:pointer}
.list-item:hover{background:#f4f6fb}
.list-item.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.list-item .li-ic{width:20px;text-align:center;color:var(--muted)}
.list-item .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
.list-empty{padding:6px 10px;color:var(--muted);font-size:12.5px}

/* ---------- 알림(토스트) ---------- */
#toasts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{padding:10px 18px;border-radius:12px;background:#28324a;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:opacity .3s,transform .3s;max-width:560px;text-align:center}
.toast.ok{background:#23875a}
.toast.warn{background:#c27311}
.toast.error{background:var(--danger)}
.toast.out{opacity:0;transform:translateY(8px)}

/* ---------- 대화상자(모달) ---------- */
.modal-back{position:fixed;inset:0;background:rgba(30,38,60,.35);display:grid;place-items:center;z-index:40}
.modal{width:440px;max-width:calc(100vw - 32px);background:#fff;border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(20,30,60,.3)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal p{margin:0 0 12px;color:#45506a}
.modal .field-label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.modal .field{margin:12px 0 0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.m-btn{padding:9px 16px;border-radius:10px;border:1.5px solid var(--line-strong);background:#fff;font-weight:700}
.m-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.m-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.m-btn.primary:hover{background:var(--accent-dark);color:#fff}
.m-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.preview{height:170px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;display:grid;place-items:center;overflow:hidden;
  background-color:#fff;background-image:linear-gradient(45deg,#eef1f6 25%,transparent 25%,transparent 75%,#eef1f6 75%),linear-gradient(45deg,#eef1f6 25%,transparent 25%,transparent 75%,#eef1f6 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.preview img{max-width:100%;max-height:166px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.preview-size{font-size:12px;color:var(--muted);text-align:right;margin-bottom:12px}
.live-preview{margin-top:10px;font-size:13px;color:var(--muted)}
.live-preview b{font-family:"Times New Roman",serif;font-size:18px;color:var(--text);font-weight:400}
</style>
</head>
<body>

<!-- ================================================================
     [화면 뼈대] 상단 바
     ================================================================ -->
<header class="topbar">
  <div class="brand">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4L20.5 19H3.5z"/><circle cx="12" cy="4" r="1.2" fill="currentColor"/></svg></div>
    <div>도형 편집기<small>수학 문제 그림 만들기</small></div>
  </div>
  <div class="tb-group">
    <button class="tb-btn" id="btnNew" title="새 작업 시작"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6"/></svg>새 작업</button>
    <button class="tb-btn" id="btnImage" title="PNG·JPG 그림 불러오기"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>그림 불러오기</button>
  </div>
  <div class="tb-group">
    <button class="tb-btn" id="btnUndo" title="실행 취소 (Ctrl+Z)"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>실행 취소</button>
    <button class="tb-btn" id="btnRedo" title="다시 실행 (Ctrl+Y)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>다시 실행</button>
  </div>
  <div class="tb-group">
    <button class="tb-btn" id="btnOpen" title="저장해 둔 작업 파일 열기 (Ctrl+O)"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>작업 열기</button>
    <button class="tb-btn" id="btnSave" title="작업을 파일로 저장 (Ctrl+S)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6"/></svg>저장</button>
    <button class="tb-btn" id="btnSaveAs" title="새 파일로 저장 (Ctrl+Shift+S)">다른 이름으로</button>
  </div>
  <div class="spacer"></div>
  <div class="work-info"><button id="workTitle" title="눌러서 작업 이름 바꾸기">이름 없는 작업</button><span id="saveState" class="save-state saved">✓ 저장됨</span></div>

/* ================================================================

const SVGNS = 'http://www.w3.org/2000/svg';

const assets = {};          // 불러온 그림 원본 { 그림ID: { src, w, h } } — 실행 취소 기록에 중복 저장하지 않으려고 따로 보관

function emptyDoc() { return { nextId: 1, objects: [], coord: defaultCoord() }; }
/* 좌표평면 설정 (작업 파일에 함께 저장되고, 실행 취소도 됩니다) */
function defaultCoord() {

const coordOn = () => doc.coord.on;
const toMath = p => ({ x: (p.x - doc.coord.ox) / doc.coord.unit, y: (doc.coord.oy - p.y) / doc.coord.unit });

/* 좌표평면이 켜져 있고 '격자에 맞추기'가 켜져 있으면 가장 가까운 격자점으로 */

  for (const k in attrs) if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);

}

    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

    else e.setAttribute(k, v === true ? '' : v);

/* ---------- [기하 계산] ---------- */
const V = {

  len: a => Math.hypot(a.x, a.y),
  dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
  norm: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },

  return V.add(a1, V.mul(r, V.cross(V.sub(b1, a1), s) / den));

/* ================================================================

   ================================================================ */

function showError(err) {

}
window.addEventListener('error', e => showError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showError(e.reason));

let modalEl = null;
function openModal({ title, body, buttons = [], width }) {
  closeModal();
  const back = H('div', { class: 'modal-back', onmousedown: e => { if (e.target === back) closeModal(); } });
  const actions = buttons.map(b => H('button', {
    class: 'm-btn ' + (b.kind || ''),
    onclick: async () => {

      catch (err) { showError(err); }
    },
  }, b.label));
  back.appendChild(H('div', { class: 'modal', style: width ? `width:${width}px` : null },
    H('h3', {}, title), body, H('div', { class: 'modal-actions' }, actions)));

}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
function confirmBox(title, message, okLabel, onOk, kind = 'primary') {

}
/* 글자를 입력받는 대화상자 (기호 버튼 포함) */

  const inp = H('input', { type: 'text', value, placeholder, maxlength: 40, oninput: () => onInput && onInput(inp.value) });
  const chipRow = chips.length ? H('div', { class: 'chips' }, chips.map(c =>
    H('button', { class: 'chip' + (/^[a-z]$/.test(c) ? ' it' : ''), title: `"${c}" 넣기`, onclick: () => insertAtCursor(inp, c) }, c))) : null;
  openModal({ title, body: H('div', {}, inp, chipRow, extra), buttons: [
    { label: '취소' },

/* ================================================================
   [실행 취소 / 다시 실행]
   변경하기 "직전"에 record()를 부르면 그 시점이 저장됩니다.
   같은 key로 연속 호출(슬라이더 드래그 등)하면 한 번으로 묶습니다.
   ================================================================ */
const hist = { undo: [], redo: [], lastKey: null, lastTime: 0 };
function snapshot() { return JSON.stringify({ doc, selectedId, multiSel }); }
function record(key) {
  const now = Date.now();
  markDirty();
  if (key && key === hist.lastKey && now - hist.lastTime < 1500) { hist.lastTime = now; return; }
  hist.undo.push(snapshot());
  if (hist.undo.length > CONFIG.historyLimit) hist.undo.shift();
  hist.redo = [];
  hist.lastKey = key || null; hist.lastTime = now;
  updateUndoButtons();
}
function restore(s) {
  const d = JSON.parse(s);
  doc = normalizeDoc(d.doc);
  selectedId = (d.selectedId === COORD_ID || getObj(d.selectedId)) ? d.selectedId : null;
  multiSel = (d.multiSel || []).filter(getObj);
  picks = []; drag = null; markDirty();
  renderAll();
}
function undo() {
  if (!hist.undo.length) { toast('더 이상 되돌릴 작업이 없어요.'); return; }
  const what = describeStep(hist.undo[hist.undo.length - 1], snapshot());
  hist.redo.push(snapshot()); restore(hist.undo.pop()); hist.lastKey = null;
  toast('↩ 되돌렸어요: ' + what);
}
function redo() {
  if (!hist.redo.length) { toast('다시 실행할 작업이 없어요.'); return; }
  const what = describeStep(snapshot(), hist.redo[hist.redo.length - 1]);
  hist.undo.push(snapshot()); restore(hist.redo.pop()); hist.lastKey = null;
  toast('↪ 다시 했어요: ' + what);
}
function updateUndoButtons() {
  const u = $('#btnUndo'), r = $('#btnRedo');
  u.disabled = !hist.undo.length; r.disabled = !hist.redo.length;
  u.title = hist.undo.length ? `실행 취소: ${describeStep(hist.undo[hist.undo.length - 1], snapshot())} (Ctrl+Z)` : '되돌릴 작업이 없어요';
  r.title = hist.redo.length ? `다시 실행: ${describeStep(snapshot(), hist.redo[hist.redo.length - 1])} (Ctrl+Y)` : '다시 실행할 작업이 없어요';
}
/* 두 시점(before → after) 사이에 무엇이 바뀌었는지 "점 A 이동"처럼 말로 설명 */
function describeStep(beforeSnap, afterSnap) {
  try {
    const a = JSON.parse(beforeSnap).doc, b = JSON.parse(afterSnap).doc;
    const A = new Map(a.objects.map(o => [o.id, o])), B = new Map(b.objects.map(o => [o.id, o]));
    const added = [...B.keys()].filter(k => !A.has(k)), removed = [...A.keys()].filter(k => !B.has(k));
    const changed = [...B.keys()].filter(k => A.has(k) && JSON.stringify(A.get(k)) !== JSON.stringify(B.get(k)));
    const nameIn = (d, id) => withDoc(d, () => objLabel(getObj(id)));
    const many = (ids, d, verb) => ids.length === 1 ? `${nameIn(d, ids[0])} ${verb}` : `개체 ${ids.length}개 ${verb}`;
    if (added.length && !removed.length) return many(added, b, '추가');
    if (removed.length && !added.length) return many(removed, a, '삭제');
    if (added.length && removed.length) return '새 작업 / 작업 열기';
    if (changed.length) {
      const strip = o => { const { x, y, ...rest } = o; return JSON.stringify(rest); };
      const moved = changed.every(k => strip(A.get(k)) === strip(B.get(k)));
      return many(changed, b, moved ? '이동' : '변경');
    }
    if (JSON.stringify(a.coord) !== JSON.stringify(b.coord)) return '좌표평면 설정';
    return '선택 변경';
  } catch (_) { return '이전 작업'; }
}
/* 잠시 다른 작업 내용(d)을 기준으로 이름 등을 계산할 때 */
function withDoc(d, fn) { const keep = doc; doc = d; try { return fn(); } finally { doc = keep; } }

/* ================================================================
   [개체 만들기] 점 · 선분 · 문자 · 길이 · 각 · 직각 · 평행 · 수직 · 그림
   ================================================================ */
function nextPointName() {
  const used = new Set(byType('point').map(p => p.name));
  for (let round = 0; ; round++) {
    for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
      const n = round ? c + round : c;
      if (!used.has(n)) return n;
    }
  }
}
/* ---------- [내 기본값] 속성창의 "이 모양을 기본값으로" 버튼으로 저장 (이 컴퓨터 브라우저에 기억) ---------- */
const STYLE_KEYS = {
  point: ['size', 'color'], segment: ['width', 'color', 'dashed'], text: ['size', 'color', 'bold', 'italic'],
  length: ['size', 'color', 'format', 'style', 'lineWidth'], angle: ['radius', 'width', 'color', 'labelSize', 'labelMode', 'fill', 'showArc'],
  right: ['size', 'width', 'color'], parallel: ['size', 'width', 'color', 'count'], perp: ['size', 'width', 'color'],
};
const store = {   // 브라우저 저장소 (막혀 있어도 프로그램은 정상 동작)
  get(k) { try { return JSON.parse(localStorage.getItem('geoEditor.' + k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem('geoEditor.' + k, JSON.stringify(v)); return true; } catch (_) { return false; } },
  del(k) { try { localStorage.removeItem('geoEditor.' + k); } catch (_) {} },
};
let userDefaults = store.get('defaults') || {};
function saveAsDefault(o) {
  userDefaults[o.type] = Object.fromEntries(STYLE_KEYS[o.type].map(k => [k, o[k]]));
  store.set('defaults', userDefaults);
  toast(`앞으로 새로 만드는 ${KIND_NAME[o.type]}은(는) 이 모양으로 만들어져요.`, 'ok');
  renderPanel();
}
function resetDefault(type) {
  delete userDefaults[type]; store.set('defaults', userDefaults);
  toast(`${KIND_NAME[type]} 기본값을 처음 설정으로 되돌렸어요.`); renderPanel();
}
function push(o) { Object.assign(o, userDefaults[o.type] || {}); doc.objects.push(o); return o; }
function addPoint(x, y) {
  const P = CONFIG.point, q = snapPt({ x, y });
  return push({ id: newId(), type: 'point', name: nextPointName(), x: q.x, y: q.y, labelCoord: false,
    size: P.size, color: P.color, visible: true, showLabel: true, labelAuto: true, labelDx: P.labelDx, labelDy: P.labelDy });
}
function addSegment(p1, p2) {
  return push({ id: newId(), type: 'segment', p1, p2, width: CONFIG.segment.width, color: CONFIG.segment.color, dashed: false, visible: true });
}
function addText(x, y, content) {
  const T = CONFIG.text;
  return push({ id: newId(), type: 'text', content, x: round1(x), y: round1(y), size: T.size, color: T.color, bold: T.bold, italic: T.italic, visible: true });
}
function addLength(segId, value, format) {
  const L = CONFIG.length, s = getObj(segId), [A, B] = segEnds(s);
  // 도형 바깥쪽(이 선분과 이어진 이웃 점들의 반대편)에 글자가 오도록 방향을 고릅니다
  const ids = new Set();
  for (const t of byType('segment')) for (const [p, q] of [[t.p1, t.p2], [t.p2, t.p1]])
    if ((p === s.p1 || p === s.p2) && q !== s.p1 && q !== s.p2) ids.add(q);
  let pts = [...ids].map(getObj).filter(Boolean);
  if (!pts.length) pts = byType('point');
  const mid = V.lerp(A, B, .5);
  const c = { x: pts.reduce((t, p) => t + p.x, 0) / pts.length, y: pts.reduce((t, p) => t + p.y, 0) / pts.length };
  const d = V.norm(V.sub(B, A)), n = { x: -d.y, y: d.x };
  let side = V.dot(V.sub(c, mid), n);
  side = Math.abs(side) < 1 ? (n.y < 0 || (n.y === 0 && n.x > 0) ? 1 : -1) : (side > 0 ? -1 : 1);
  const style = (userDefaults.length || {}).style || L.style;
  const o = push({ id: newId(), type: 'length', seg: segId, value, format, style, t: 0.5,
    offset: side * (style === 'brace' ? L.braceDepth : L.gap), size: L.size, color: L.color, lineWidth: L.lineWidth, visible: true });
  o.format = format;   // 입력 창에서 고른 표시 방법이 우선
  return o;
}
function addAngle(p1, vertex, p2) {
  const A = CONFIG.angle;
  return push({ id: newId(), type: 'angle', p1, vertex, p2, radius: A.radius, arcs: 1, showArc: true, fill: false,
    labelMode: A.labelMode, label: '', labelSize: A.labelSize, width: A.width, color: A.color, visible: true });
}
function addRight(p1, vertex, p2) {
  const R = CONFIG.right;
  return push({ id: newId(), type: 'right', p1, vertex, p2, size: R.size, width: R.width, color: R.color, visible: true });
}
function addParallel(s1, s2) {
  const P = CONFIG.parallel;
  return push({ id: newId(), type: 'parallel', segs: [s1, s2], count: P.count, size: P.size, t: 0.5, width: P.width, color: P.color, visible: true });
}
function addPerp(s1, s2) {
  const P = CONFIG.perp;
  return push({ id: newId(), type: 'perp', segs: [s1, s2], size: P.size, width: P.width, color: P.color, visible: true });
}

/* 이 개체가 기대고 있는 다른 개체들 (점이 지워지면 연결된 선분·표시도 함께 지움) */
function refsOf(o) {
  switch (o.type) {
    case 'segment': return [o.p1, o.p2];
    case 'length': return [o.seg];
    case 'angle': case 'right': return [o.p1, o.vertex, o.p2];
    case 'parallel': case 'perp': return o.segs;
    default: return [];
  }
}
function withDependents(id) {
  const gone = new Set([id]);
  for (let changed = true; changed;) {
    changed = false;
    for (const o of doc.objects) if (!gone.has(o.id) && refsOf(o).some(r => gone.has(r))) { gone.add(o.id); changed = true; }
  }
  return gone;
}

/* 이름 붙이기 */
const pname = id => { const p = getObj(id); return p ? p.name || '?' : '?'; };
function segmentName(s) { return s ? pname(s.p1) + pname(s.p2) : '?'; }
function lengthText(o) { return o.format === 'named' ? `${segmentName(getObj(o.seg))} = ${o.value}` : o.value; }
function objLabel(o) {
  switch (o.type) {
    case 'point': return '점 ' + (o.name || '(이름 없음)');
    case 'segment': return '선분 ' + segmentName(o);
    case 'text': return '문자 “' + (o.content.length > 10 ? o.content.slice(0, 10) + '…' : o.content) + '”';
    case 'length': return '길이 ' + segmentName(getObj(o.seg));
    case 'angle': return '각 ∠' + pname(o.p1) + pname(o.vertex) + pname(o.p2);
    case 'right': return '직각 ∠' + pname(o.p1) + pname(o.vertex) + pname(o.p2);
    case 'parallel': return '평행 ' + segmentName(getObj(o.segs[0])) + ' ∥ ' + segmentName(getObj(o.segs[1]));
    case 'perp': return '수직 ' + segmentName(getObj(o.segs[0])) + ' ⊥ ' + segmentName(getObj(o.segs[1]));
    case 'image': return '그림 ' + (byType('image').indexOf(o) + 1);
    default: return o.type;
  }
}
const KIND_NAME = { point: '점', segment: '선분', text: '문자', length: '길이 표시', angle: '각 표시', right: '직각 표시', parallel: '평행 표시', perp: '수직 표시', image: '그림' };

/* ================================================================
   [표시 모양 계산] 길이 · 각 · 직각 · 수직
   ================================================================ */
function lengthGeom(o) {
  const ends = segEnds(getObj(o.seg)); if (!ends) return null;
  const [A, B] = ends; if (V.dist(A, B) < 1) return null;
  const d = V.norm(V.sub(B, A)), n = { x: -d.y, y: d.x };
  const text = lengthText(o), sg = o.offset >= 0 ? 1 : -1;
  const ext = Math.abs(n.x) * textWidth(text, o.size) / 2 + Math.abs(n.y) * o.size * 0.45;   // 글자 절반 크기(법선 방향)
  let label, bow = null;
  if (o.style === 'brace') {
    const mid = V.lerp(A, B, .5), ctrl = V.add(mid, V.mul(n, 2 * o.offset));
    bow = `M${A.x} ${A.y} Q${ctrl.x} ${ctrl.y} ${B.x} ${B.y}`;
    label = V.add(mid, V.mul(n, o.offset + sg * (5 + ext)));
  } else {
    label = V.add(V.lerp(A, B, o.t), V.mul(n, o.offset + sg * ext));
  }
  return { A, B, d, n, text, label, bow, ext };
}
function angleGeom(o) {
  const A = getObj(o.p1), B = getObj(o.vertex), C = getObj(o.p2);
  if (!A || !B || !C || V.dist(A, B) < 1 || V.dist(C, B) < 1) return null;
  const a1 = Math.atan2(A.y - B.y, A.x - B.x), a2 = Math.atan2(C.y - B.y, C.x - B.x);
  let d = a2 - a1;
  while (d <= -Math.PI) d += 2 * Math.PI;
  while (d > Math.PI) d -= 2 * Math.PI;
  return { B, a1, d, deg: Math.abs(d) * 180 / Math.PI };
}
const polar = (B, r, a) => ({ x: B.x + r * Math.cos(a), y: B.y + r * Math.sin(a) });
function arcPath(B, r, a1, d) {
  const p = polar(B, r, a1), q = polar(B, r, a1 + d);
  return `M${p.x} ${p.y} A${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${q.x} ${q.y}`;
}
function sectorPath(B, r, a1, d) { return `M${B.x} ${B.y} L` + arcPath(B, r, a1, d).slice(1) + 'Z'; }
function angleLabel(o, G) {
  if (o.labelMode === 'none') return '';
  if (o.labelMode === 'custom') return o.label;
  return Math.round(G.deg) + '°';
}
function cornerPath(X, u, v, s) {   // 꼭짓점 X에서 u, v 방향으로 크기 s인 직각 표시
  const p1 = V.add(X, V.mul(u, s)), p3 = V.add(X, V.mul(v, s)), p2 = V.add(p1, V.mul(v, s));
  return { open: `M${p1.x} ${p1.y} L${p2.x} ${p2.y} L${p3.x} ${p3.y}`, closed: `M${X.x} ${X.y} L${p1.x} ${p1.y} L${p2.x} ${p2.y} L${p3.x} ${p3.y}Z` };
}
function rightGeom(o) {
  const A = getObj(o.p1), B = getObj(o.vertex), C = getObj(o.p2);
  if (!A || !B || !C || V.dist(A, B) < 1 || V.dist(C, B) < 1) return null;
  return { X: B, u: V.norm(V.sub(A, B)), v: V.norm(V.sub(C, B)) };
}
function perpGeom(o) {
  const e1 = segEnds(getObj(o.segs[0])), e2 = segEnds(getObj(o.segs[1]));
  if (!e1 || !e2) return null;
  const X = lineIntersect(e1[0], e1[1], e2[0], e2[1]); if (!X) return null;
  // 교점에서 각 선분의 먼 쪽 끝을 향하도록
  const far = ([a, b]) => V.norm(V.sub(V.dist(X, a) > V.dist(X, b) ? a : b, X));
  return { X, u: far(e1), v: far(e2) };
}
function chevronPath(A, B, t, count, size) {
  const d = V.norm(V.sub(B, A)), n = { x: -d.y, y: d.x }, c = V.lerp(A, B, t);
  let path = '';
  for (let i = 0; i < count; i++) {
    const off = (i - (count - 1) / 2) * size * 0.75;
    const tip = V.add(c, V.mul(d, off + size * 0.4)), back = V.add(c, V.mul(d, off - size * 0.4));
    const w1 = V.add(back, V.mul(n, size * 0.55)), w2 = V.sub(back, V.mul(n, size * 0.55));
    path += `M${w1.x} ${w1.y} L${tip.x} ${tip.y} L${w2.x} ${w2.y} `;
  }
  return path;
}

/* 점 이름 위치: '자동'이면 연결된 선분들의 반대쪽(도형 바깥)에 놓습니다 */
const LABEL_DIRS = { nw: [-1, -1], n: [0, -1], ne: [1, -1], w: [-1, 0], e: [1, 0], sw: [-1, 1], s: [0, 1], se: [1, 1] };
function pointLabelPos(o) {
  const P = CONFIG.point;
  let dir = null;
  if (o.labelAuto !== false) {
    let sum = { x: 0, y: 0 }, first = null;
    for (const s of byType('segment')) {
      const other = s.p1 === o.id ? getObj(s.p2) : s.p2 === o.id ? getObj(s.p1) : null;
      if (!other || V.dist(other, o) < 0.5) continue;
      const u = V.norm(V.sub(other, o));
      sum = V.add(sum, u); first = first || u;
    }
    if (!first) dir = V.norm({ x: P.labelDx, y: P.labelDy });   // 연결된 선분이 없으면 오른쪽 위
    else if (V.len(sum) < 0.2) {   // 일직선 한가운데 점: 선에 수직인 방향(위쪽)으로
      dir = { x: first.y, y: -first.x };
      if (dir.y > 0) dir = V.mul(dir, -1);
    } else dir = V.norm(V.mul(sum, -1));
  } else if (o.labelDir && LABEL_DIRS[o.labelDir]) {
    dir = V.norm({ x: LABEL_DIRS[o.labelDir][0], y: LABEL_DIRS[o.labelDir][1] });
  } else {
    return { x: o.x + o.labelDx, y: o.y + o.labelDy };
  }
  const ext = Math.abs(dir.x) * textWidth(pointLabelText(o), P.labelSize) / 2 + Math.abs(dir.y) * P.labelSize * 0.38;
  return V.add(o, V.mul(dir, o.size + P.labelGap + ext));
}
/* 점 이름 글자: 'A' 또는 좌표 포함 'A(3, 5)' */
function pointLabelText(o) {
  if (!o.labelCoord || !coordOn()) return o.name;
  const m = toMath(o);
  return `${o.name}(${fmtNum(m.x)}, ${fmtNum(m.y)})`;
}

/* ================================================================
   [좌표평면 그리기] 격자 · x축 · y축 · 눈금 · 숫자 · 원점 O
   한 칸(unit px)이 수학 좌표 1입니다.
   ================================================================ */
function drawCoord(g) {
  const c = doc.coord, C = CONFIG.coord, W = CONFIG.paper.width, Hh = CONFIG.paper.height, u = c.unit;
  const xs = [], ys = [];   // 종이 안에 들어오는 정수 좌표들
  for (let k = Math.ceil(-c.ox / u); k <= Math.floor((W - c.ox) / u); k++) xs.push(k);
  for (let j = Math.ceil((c.oy - Hh) / u); j <= Math.floor(c.oy / u); j++) ys.push(j);
  const X = k => c.ox + k * u, Y = j => c.oy - j * u;
  const inX = c.ox >= 0 && c.ox <= W, inY = c.oy >= 0 && c.oy <= Hh;   // 축이 종이 안에 있는지
  if (c.grid) {
    let d = '';
    for (const k of xs) d += `M${X(k)} 0V${Hh}`;
    for (const j of ys) d += `M0 ${Y(j)}H${W}`;
    S('path', { d, stroke: C.gridColor, 'stroke-width': C.gridWidth, fill: 'none' }, g);
  }
  const ax = { stroke: C.axisColor, 'stroke-width': C.axisWidth, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  const a = 7;   // 화살촉 크기
  if (c.xAxis && inY) S('path', { ...ax, d: `M0 ${c.oy}H${W} M${W - a} ${c.oy - a * .6}L${W} ${c.oy}L${W - a} ${c.oy + a * .6}` }, g);
  if (c.yAxis && inX) S('path', { ...ax, d: `M${c.ox} ${Hh}V0 M${c.ox - a * .6} ${a}L${c.ox} 0L${c.ox + a * .6} ${a}` }, g);
  if (c.ticks) {
    let d = '';
    if (inY) for (const k of xs) if (k && X(k) < W - a) d += `M${X(k)} ${c.oy - 4}V${c.oy + 4}`;
    if (inX) for (const j of ys) if (j && Y(j) > a) d += `M${c.ox - 4} ${Y(j)}H${c.ox + 4}`;
    if (d) S('path', { ...ax, 'stroke-width': C.axisWidth * 0.8, d }, g);
  }
  const every = u >= 28 ? 1 : u >= 18 ? 2 : 5;   // 칸이 작으면 숫자를 건너뛰며 씁니다
  const num = (x, y, str, anchor) => {
    const t = S('text', { x, y, fill: C.axisColor, 'font-size': C.numberSize, 'font-family': CONFIG.mathFont, 'text-anchor': anchor, 'dominant-baseline': 'central', ...HALO() }, g);
    t.textContent = str;
  };
  if (c.numbers) {
    if (inY) for (const k of xs) if (k && k % every === 0 && X(k) < W - 10) num(X(k), c.oy + 13, fmtNum(k), 'middle');
    if (inX) for (const j of ys) if (j && j % every === 0 && Y(j) > 10) num(c.ox - 8, Y(j), fmtNum(j), 'end');
  }
  if (c.origin && inX && inY) {
    const t = S('text', { x: c.ox - 7, y: c.oy + 13, fill: C.axisColor, 'font-size': C.numberSize + 3, 'font-family': CONFIG.mathFont, 'font-style': 'italic', 'text-anchor': 'end', 'dominant-baseline': 'central', ...HALO() }, g);
    t.textContent = 'O';
  }
  if (c.axisNames) {
    const it = { fill: C.axisColor, 'font-size': C.numberSize + 5, 'font-family': CONFIG.mathFont, 'font-style': 'italic', 'dominant-baseline': 'central', ...HALO() };
    if (c.xAxis && inY) { const t = S('text', { ...it, x: W - 4, y: c.oy - 15, 'text-anchor': 'end' }, g); t.textContent = 'x'; }
    if (c.yAxis && inX) { const t = S('text', { ...it, x: c.ox + 11, y: 8, 'text-anchor': 'start' }, g); t.textContent = 'y'; }
  }
}

/* ================================================================
   [그리기] 작업 영역(SVG)에 개체를 그립니다.
   drawScene은 화면용('edit')과 PNG 저장용('export') 모두에 쓰입니다.
   개체 종류마다 DRAW.종류(g, o, ctx) 함수가 모양을 그립니다.
   ================================================================ */
function pxPerUnit() { const m = board.getScreenCTM(); return m && m.a ? m.a : 1; }
function toBoard(e) {
  const p = board.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(board.getScreenCTM().inverse());
}
function dashFor(s) { return s.dashed ? CONFIG.segment.dashPattern.map(v => v * s.width).join(' ') : null; }
/* 좌표평면이 켜져 있으면 글자 둘레에 흰 테두리를 둘러 격자선 위에서도 잘 읽히게 */
const HALO = () => coordOn() ? { stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round', 'paint-order': 'stroke' } : {};
function mathText(g, x, y, str, size, color, extra = {}) {
  const t = S('text', { x, y, fill: color, 'font-size': size, 'font-family': CONFIG.mathFont, 'text-anchor': 'middle', 'dominant-baseline': 'central', ...HALO(), ...extra }, g);
  t.textContent = str;
  return t;
}
const HIT = 'transparent';

const DRAW = {
  segment(g, o, { edit, k }) {
    const e = segEnds(o); if (!e) return false;
    const [a, b] = e;
    if (edit) S('line', { class: 'hit', x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: HIT, 'stroke-width': CONFIG.hitRadius * 2 * k, 'pointer-events': 'stroke' }, g);
    S('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: o.color, 'stroke-width': o.width,
      'stroke-linecap': o.dashed ? 'butt' : 'round', 'stroke-dasharray': dashFor(o) }, g);
  },
  point(g, o, { edit, k }) {
    if (edit) S('circle', { class: 'hit', cx: o.x, cy: o.y, r: Math.max(o.size + 3 * k, CONFIG.hitRadius * k), fill: HIT, 'pointer-events': 'all' }, g);
    S('circle', { cx: o.x, cy: o.y, r: o.size, fill: o.color }, g);
    if (o.showLabel && o.name) {
      const L = pointLabelPos(o);
      mathText(g, L.x, L.y, pointLabelText(o), CONFIG.point.labelSize, o.color, { 'font-style': CONFIG.point.labelItalic ? 'italic' : 'normal' });
    }
  },
  text(g, o) {
    mathText(g, o.x, o.y, o.content, o.size, o.color, { 'font-weight': o.bold ? 700 : 400, 'font-style': o.italic ? 'italic' : 'normal', 'pointer-events': 'bounding-box' });
  },
  length(g, o, { edit, k }) {
    const G = lengthGeom(o); if (!G) return false;
    if (G.bow) {
      if (edit) S('path', { class: 'hit', d: G.bow, fill: 'none', stroke: HIT, 'stroke-width': 10 * k, 'pointer-events': 'stroke' }, g);
      S('path', { d: G.bow, fill: 'none', stroke: o.color, 'stroke-width': o.lineWidth }, g);
    }
    mathText(g, G.label.x, G.label.y, G.text, o.size, o.color, { 'pointer-events': 'bounding-box' });
  },
  angle(g, o, { edit }) {
    const G = angleGeom(o); if (!G) return false;
    const rOut = o.radius + (o.arcs - 1) * CONFIG.angle.arcGap;
    if (edit) S('path', { class: 'hit', d: sectorPath(G.B, rOut + 4, G.a1, G.d), fill: HIT, 'pointer-events': 'all' }, g);
    if (o.fill) S('path', { d: sectorPath(G.B, o.radius, G.a1, G.d), fill: o.color, 'fill-opacity': CONFIG.angle.fillOpacity, stroke: 'none' }, g);
    if (o.showArc) for (let i = 0; i < o.arcs; i++)
      S('path', { d: arcPath(G.B, o.radius + i * CONFIG.angle.arcGap, G.a1, G.d), fill: 'none', stroke: o.color, 'stroke-width': o.width }, g);
    const label = angleLabel(o, G);
    if (label) {
      const mid = G.a1 + G.d / 2, ux = Math.cos(mid), uy = Math.sin(mid);
      const ext = Math.abs(ux) * textWidth(label, o.labelSize) / 2 + Math.abs(uy) * o.labelSize * 0.45;
      const p = polar(G.B, rOut + 4 + ext, mid);
      mathText(g, p.x, p.y, label, o.labelSize, o.color, { 'pointer-events': 'bounding-box' });
    }
  },
  right(g, o, { edit }) {
    const G = rightGeom(o); if (!G) return false;
    const c = cornerPath(G.X, G.u, G.v, o.size);
    if (edit) S('path', { class: 'hit', d: c.closed, fill: HIT, stroke: HIT, 'stroke-width': 8, 'pointer-events': 'all' }, g);
    S('path', { d: c.open, fill: 'none', stroke: o.color, 'stroke-width': o.width, 'stroke-linejoin': 'miter' }, g);
  },
  perp(g, o, { edit }) {
    const G = perpGeom(o); if (!G) return false;
    const c = cornerPath(G.X, G.u, G.v, o.size);
    if (edit) S('path', { class: 'hit', d: c.closed, fill: HIT, stroke: HIT, 'stroke-width': 8, 'pointer-events': 'all' }, g);
    S('path', { d: c.open, fill: 'none', stroke: o.color, 'stroke-width': o.width, 'stroke-linejoin': 'miter' }, g);
  },
  parallel(g, o, { edit, k }) {
    const e1 = segEnds(getObj(o.segs[0])), e2 = segEnds(getObj(o.segs[1]));
    if (!e1 || !e2) return false;
    // 두 선분의 화살표가 같은 방향을 가리키도록 맞춥니다
    const d1 = V.sub(e1[1], e1[0]), d2 = V.sub(e2[1], e2[0]);
    const second = V.dot(d1, d2) < 0 ? [e2[1], e2[0]] : e2;
    const path = chevronPath(e1[0], e1[1], o.t, o.count, o.size) + chevronPath(second[0], second[1], o.t, o.count, o.size);
    if (edit) S('path', { class: 'hit', d: path, fill: 'none', stroke: HIT, 'stroke-width': 14 * k, 'pointer-events': 'stroke' }, g);
    S('path', { d: path, fill: 'none', stroke: o.color, 'stroke-width': o.width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  },
};
/* 그리는 순서(아래 → 위): 그림 → 선분 → 각·직각·평행·수직 → 문자·길이 → 점 (점은 항상 맨 위라 언제나 잡을 수 있어요) */
const LAYER_OF = { image: 0, segment: 1, angle: 2, right: 2, parallel: 2, perp: 2, text: 3, length: 3, point: 4 };
/* 선택했을 때 파란 빛으로 감싸 보여줄 종류 (점·선분·그림은 따로 표시) */
const GLOW_TYPES = new Set(['text', 'length', 'angle', 'right', 'parallel', 'perp']);

function glow(g, k) {
  const first = g.firstChild;
  for (const c of [...g.children]) {
    if (c.classList.contains('hit')) continue;
    const cl = c.cloneNode(true);
    const isText = c.tagName === 'text';
    cl.setAttribute('stroke', '#5b7cfa'); cl.setAttribute('stroke-opacity', '.38');
    cl.setAttribute('stroke-width', (parseFloat(c.getAttribute('stroke-width')) || 0) + 7 * k);
    cl.setAttribute('stroke-linejoin', 'round'); cl.setAttribute('stroke-linecap', 'round');
    cl.setAttribute('fill', isText ? '#5b7cfa' : 'none'); cl.setAttribute('fill-opacity', '.38');
    cl.setAttribute('pointer-events', 'none');
    g.insertBefore(cl, first);
  }
}

function drawScene(root, mode, opt = {}) {
  const edit = mode === 'edit';
  const k = edit ? 1 / pxPerUnit() : 1;          // 화면 1px이 종이에서 몇 단위인지
  const layers = [0, 1, 2, 3, 4].map(() => S('g', {}, root));
  // 좌표평면은 배경 그림 바로 위, 선분 아래에 그립니다
  if (coordOn()) drawCoord(root.insertBefore(S('g', { class: 'coord-layer', 'pointer-events': 'none' }), layers[1]));
  for (const o of doc.objects) {
    if (o.type === 'image') {
      if (!edit && opt.includeImages === false) continue;
      const a = assets[o.asset]; if (!a) continue;
      const g = S('g', edit ? { 'data-id': o.id, class: 'obj image ' + (o.locked ? 'locked' : 'unlocked') } : {}, layers[0]);
      S('image', { href: a.src, x: o.x, y: o.y, width: o.w, height: o.h, preserveAspectRatio: 'none', opacity: o.opacity }, g);
      continue;
    }
    if (!edit && o.visible === false) continue;
    const draw = DRAW[o.type]; if (!draw) continue;
    const g = S('g', edit ? { 'data-id': o.id, class: `obj ${o.type}` + (o.visible === false ? ' is-hidden' : '') } : {}, layers[LAYER_OF[o.type]]);
    if (draw(g, o, { edit, k }) === false) { g.remove(); continue; }
    if (edit && isSelected(o.id) && GLOW_TYPES.has(o.type)) glow(g, k);
  }
}

let LAYER = null;
function setupBoard() {
  const { width: W, height: Hh } = CONFIG.paper;
  board.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  S('rect', { class: 'paper', x: 0, y: 0, width: W, height: Hh }, board);
  LAYER = { content: S('g', { id: 'content' }, board), overlay: S('g', { class: 'overlay' }, board) };
  applyView();
}

/* ================================================================
   [화면 확대/축소] 보기만 바뀌고 그림 자체는 바뀌지 않습니다 (PNG 크기와 무관)
   view.scale = 화면 1픽셀당 종이 몇 픽셀인지의 반대(1 = 100%)
   ================================================================ */
const view = { fit: true, scale: 1, cx: CONFIG.paper.width / 2, cy: CONFIG.paper.height / 2 };
function fitScale() {
  const r = wrap.getBoundingClientRect(), { width: W, height: Hh, margin: M } = CONFIG.paper;
  return Math.min(r.width / (W + 2 * M), r.height / (Hh + 2 * M));
}
function applyView() {
  const r = wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  if (view.fit) { view.scale = fitScale(); view.cx = CONFIG.paper.width / 2; view.cy = CONFIG.paper.height / 2; }
  const w = r.width / view.scale, h = r.height / view.scale;
  board.setAttribute('viewBox', `${view.cx - w / 2} ${view.cy - h / 2} ${w} ${h}`);
  $('#zoomPct').textContent = Math.round(view.scale * 100) + '%';
}
/* anchor(종이 위 한 점)를 화면에서 같은 자리에 둔 채로 확대/축소 */
function zoomTo(scale, anchor) {
  const Z = CONFIG.zoom;
  scale = clamp(scale, Z.min, Z.max);
  if (anchor) {
    const k = view.scale / scale;
    view.cx = anchor.x + (view.cx - anchor.x) * k;
    view.cy = anchor.y + (view.cy - anchor.y) * k;
  }
  view.scale = scale; view.fit = false;
  applyView(); renderCanvas();
}
function zoomFit() { view.fit = true; applyView(); renderCanvas(); }
function panBy(dxScreen, dyScreen) {
  view.fit = false;
  view.cx -= dxScreen / view.scale; view.cy -= dyScreen / view.scale;
  applyView(); renderOverlay();
}

function renderCanvas() {
  LAYER.content.replaceChildren();
  drawScene(LAYER.content, 'edit');
  board.setAttribute('class', 'tool-' + tool);
  $('#emptyHint').style.display = doc.objects.length ? 'none' : '';
  renderOverlay();
}

/* 선택 표시, 크기 조절 손잡이, 도구 미리보기 등 (PNG에는 저장되지 않음) */
const HANDLES = { nw: 'nwse-resize', n: 'ns-resize', ne: 'nesw-resize', e: 'ew-resize', se: 'nwse-resize', s: 'ns-resize', sw: 'nesw-resize', w: 'ew-resize' };
function renderOverlay() {
  const ov = LAYER.overlay; ov.replaceChildren();
  const k = 1 / pxPerUnit();
  const accent = '#5b7cfa', orange = '#f59f3a';
  const sel = getObj(selectedId);
  const ring = (p, color, extra = 6) => S('circle', { cx: p.x, cy: p.y, r: p.size + extra * k, fill: color, 'fill-opacity': .12, stroke: color, 'stroke-width': 2.2 * k }, ov);
  const band = (s, color, op) => { const e = segEnds(s); if (e) S('line', { x1: e[0].x, y1: e[0].y, x2: e[1].x, y2: e[1].y, stroke: color, 'stroke-opacity': op, 'stroke-width': s.width + 9 * k, 'stroke-linecap': 'round' }, ov); };

  // 선택된 점·선분 (여러 개 선택 포함), 여러 개 선택한 그림은 점선 테두리만
  for (const o of selectionIds().map(getObj)) {
    if (o.type === 'point') ring(o, accent);
    else if (o.type === 'segment') band(o, accent, .35);
    else if (o.type === 'image' && multiSel.length) S('rect', { x: o.x, y: o.y, width: o.w, height: o.h, fill: 'none', stroke: accent, 'stroke-width': 2 * k, 'stroke-dasharray': `${6 * k} ${4 * k}` }, ov);
  }
  // 선택 도구: 마우스를 올린 개체를 연하게 미리 보여 줍니다 (클릭하면 이것이 선택돼요)
  const hv = tool === 'select' && !drag && hover.objId && !isSelected(hover.objId) ? getObj(hover.objId) : null;
  if (hv) {
    if (hv.type === 'point') S('circle', { cx: hv.x, cy: hv.y, r: hv.size + 6 * k, fill: 'none', stroke: accent, 'stroke-opacity': .6, 'stroke-width': 1.5 * k }, ov);
    else if (hv.type === 'segment') band(hv, accent, .15);
    else if (hv.type !== 'image') {
      const el = LAYER.content.querySelector(`[data-id="${hv.id}"]`);
      if (el) { const b = el.getBBox(), p = 4 * k; S('rect', { x: b.x - p, y: b.y - p, width: b.width + 2 * p, height: b.height + 2 * p, rx: 4 * k, fill: 'none', stroke: accent, 'stroke-opacity': .6, 'stroke-width': 1.3 * k, 'stroke-dasharray': `${4 * k} ${3 * k}` }, ov); }
    }
  }
  // 끌어서 여러 개 고르는 네모
  if (drag && drag.kind === 'box' && drag.cur) {
    const x = Math.min(drag.start.x, drag.cur.x), y = Math.min(drag.start.y, drag.cur.y);
    S('rect', { x, y, width: Math.abs(drag.cur.x - drag.start.x), height: Math.abs(drag.cur.y - drag.start.y), fill: accent, 'fill-opacity': .08, stroke: accent, 'stroke-width': 1.2 * k, 'stroke-dasharray': `${5 * k} ${3 * k}` }, ov);
  }
  if (sel && sel.type === 'image') {
    S('rect', { x: sel.x, y: sel.y, width: sel.w, height: sel.h, fill: 'none', stroke: sel.locked ? orange : accent, 'stroke-width': 2 * k, 'stroke-dasharray': `${6 * k} ${4 * k}` }, ov);
    if (sel.locked) {
      const g = S('g', { transform: `translate(${sel.x + 6 * k},${sel.y + 6 * k}) scale(${k})` }, ov);
      S('rect', { width: 64, height: 24, rx: 12, fill: orange }, g);
      const t = S('text', { x: 32, y: 16.5, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 700, fill: '#fff', 'font-family': 'Malgun Gothic, sans-serif' }, g);
      t.textContent = '🔒 잠김';
    } else {
      const pos = { nw: [0, 0], n: [.5, 0], ne: [1, 0], e: [1, .5], se: [1, 1], s: [.5, 1], sw: [0, 1], w: [0, .5] };
      const hs = 11 * k;
      for (const h in pos) {
        S('rect', { class: 'handle', 'data-handle': h, x: sel.x + sel.w * pos[h][0] - hs / 2, y: sel.y + sel.h * pos[h][1] - hs / 2,
          width: hs, height: hs, rx: 2.5 * k, fill: '#fff', stroke: accent, 'stroke-width': 2 * k, style: `cursor:${HANDLES[h]}` }, ov);
      }
    }
  }

  const T = TOOLS[tool];
  if (T.pick) {
    // 지금까지 고른 점·선분은 주황색으로
    const picked = picks.map(getObj).filter(Boolean);
    for (const o of picked) o.type === 'point' ? ring(o, orange, 7) : band(o, orange, .5);
    // 점을 고르는 도구: 고른 점들을 잇는 미리보기 점선
    if (T.pick === 'point' && picked.length && !drag) {
      const pts = [...picked], tgt = getObj(hover.pointId) || hover.pos;
      if (tgt) pts.push(tgt);
      if (pts.length > 1) S('polyline', { points: pts.map(p => `${p.x},${p.y}`).join(' '), fill: 'none', stroke: accent, 'stroke-width': 2 * k, 'stroke-dasharray': `${6 * k} ${5 * k}` }, ov);
    }
    // 선분을 고르는 도구: 마우스 아래 선분을 파랗게
    if (T.pick === 'segment' && !drag) { const hs = getObj(hover.segId); if (hs && !picks.includes(hs.id)) band(hs, accent, .3); }
  }
  // 점을 찍는 도구: 마우스 위치 미리보기 (기존 점 위면 그 점을 강조)
  if (!drag && (tool === 'point' || (T.pick === 'point'))) {
    const hp = getObj(hover.pointId);
    if (hp) S('circle', { cx: hp.x, cy: hp.y, r: hp.size + 6 * k, fill: 'none', stroke: accent, 'stroke-width': 2 * k }, ov);
    else if (hover.pos) { const q = snapPt(hover.pos); S('circle', { cx: q.x, cy: q.y, r: CONFIG.point.size, fill: accent, 'fill-opacity': .45 }, ov); }
  }
}

/* ================================================================
   [도구 선택]
   ================================================================ */
function buildToolbar() {
  const bar = $('#toolbar'), before = bar.querySelector('.shortcuts');
  for (const sec of TOOLBAR) {
    bar.insertBefore(H('div', { class: 'section-title' }, sec.title), before);
    bar.insertBefore(H('div', { class: 'tool-grid' }, sec.tools.map(t => {
      const T = TOOLS[t];
      return H('button', { class: 'tool-btn', 'data-tool': t, title: T.label + (T.key ? ` (${T.key.toUpperCase()})` : ''), onclick: () => setTool(t) },
        T.key ? H('span', { class: 'key' }, T.key.toUpperCase()) : null, icon(T.icon), T.label);
    })), before);
  }
  // 보기: 좌표평면 켜고 끄기 + 설정 열기
  bar.insertBefore(H('div', { class: 'section-title' }, '보기'), before);
  bar.insertBefore(H('div', { class: 'tool-grid' },
    H('button', { class: 'tool-btn wide', id: 'btnCoord', title: '좌표평면 켜기/설정', onclick: openCoord },
      icon('coord'), '좌표평면', H('span', { class: 'pill', id: 'coordPill' }, '꺼짐'))), before);
}
function updateCoordButton() {
  $('#btnCoord').classList.toggle('on', coordOn());
  $('#coordPill').textContent = coordOn() ? '켜짐' : '꺼짐';
}
function openCoord() {
  if (!coordOn()) {
    record();
    doc.coord.on = true;
    toast('좌표평면을 켰어요. 오른쪽에서 격자·축·한 칸 크기를 바꿀 수 있어요.', 'ok');
  }
  if (tool !== 'select') setTool('select');
  select(COORD_ID);
}
function setTool(t) {
  tool = t; picks = []; tempHint = null;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  $('#toolChip').textContent = '현재 도구: ' + TOOLS[t].label;
  renderCanvas(); updateHint();
}
function updateHint() {
  const el = $('#hint');
  el.replaceChildren();
  if (tempHint) { el.textContent = tempHint; el.classList.add('warn'); return; }
  el.classList.remove('warn');
  const T = TOOLS[tool];
  if (T.pick) {
    const n = picks.length;
    el.append(H('span', { class: 'step' }, `${n + 1} / ${T.n}`), `${T.steps[n]}을 클릭하세요.`);
    if (n === 0 && T.tip) el.append(' ' + T.tip);
    if (n > 0) el.append(' (취소: Esc)');
  } else el.textContent = T.hint;
}
function setTempHint(msg) { tempHint = msg; updateHint(); }

/* ================================================================
   [선택] 하나 선택 · 여러 개 선택(Shift+클릭, 끌어서 네모, Ctrl+A)
   ================================================================ */
function select(id) {
  selectedId = id; multiSel = [];
  tempHint = null;
  renderAll();
}
function selectMany(ids) {
  ids = [...new Set(ids)].filter(getObj);
  if (ids.length <= 1) { select(ids[0] || null); return; }
  multiSel = ids; selectedId = null; tempHint = null;
  renderAll();
}
const isSelected = id => id === selectedId || multiSel.includes(id);
/* 지금 선택된 개체 id들 (좌표평면 설정창은 빼고) */
function selectionIds() { return multiSel.length ? [...multiSel] : (getObj(selectedId) ? [selectedId] : []); }
function toggleSelect(id) {
  const ids = selectionIds();
  selectMany(ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
}
function selectAll() {
  const ids = doc.objects.filter(o => !(o.type === 'image' && o.locked)).map(o => o.id);
  if (!ids.length) { toast('선택할 개체가 없어요.'); return; }
  if (tool !== 'select') setTool('select');
  selectMany(ids);
  toast(`개체 ${ids.length}개를 모두 선택했어요. (잠긴 그림은 빼고)`);
}
/* 옮길 때 실제로 움직이는 것들: 점·문자·그림은 그 자체, 선분·표시는 연결된 점들 */
function moversFor(ids) {
  const out = new Set();
  const addRefs = id => {
    const o = getObj(id); if (!o) return;
    if (o.type === 'point' || o.type === 'text') out.add(o);
    else if (o.type === 'image') { if (!o.locked) out.add(o); }
    else refsOf(o).forEach(addRefs);
  };
  ids.forEach(addRefs);
  return [...out];
}
function groupDragInfo(ids, pt) {
  const items = moversFor(ids).map(o => ({ o, x0: o.x, y0: o.y }));
  return items.length ? { kind: 'group', items, start: pt } : null;
}
/* 묶음 옮기기: 격자에 맞추는 중이면 첫 번째 점이 격자점에 오도록 이동량을 맞춥니다 */
function moveGroup(items, dx, dy) {
  const anchor = items.find(it => it.o.type === 'point');
  if (anchor && coordOn() && doc.coord.snap) {
    const s = snapPt({ x: anchor.x0 + dx, y: anchor.y0 + dy });
    dx = s.x - anchor.x0; dy = s.y - anchor.y0;
  }
  for (const it of items) { it.o.x = round1(it.x0 + dx); it.o.y = round1(it.y0 + dy); }
}
/* 네모 안에 완전히 들어온 개체들 */
function objectsInBox(a, b) {
  const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x), y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
  const inside = p => p && p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  const pointsOf = o => {
    if (o.type === 'point' || o.type === 'text') return [o];
    if (o.type === 'image') return [{ x: o.x, y: o.y }, { x: o.x + o.w, y: o.y + o.h }];
    return moversFor([o.id]);
  };
  return doc.objects.filter(o => !(o.type === 'image' && o.locked)).filter(o => { const ps = pointsOf(o); return ps.length && ps.every(inside); }).map(o => o.id);
}

/* ================================================================
   [마우스 조작] 클릭 · 드래그
   ================================================================ */
function blurInputs() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) a.blur();
}
function beginDrag(e, info) {
  drag = { ...info, moved: false };
  try { board.setPointerCapture(e.pointerId); } catch (_) {}
}
/* 클릭한 곳에서 가장 가까운 점 / 선분 찾기 (그림·글자에 가려져도 찾을 수 있게 거리로 계산) */
function nearestPoint(pt) {
  const r = CONFIG.hitRadius / pxPerUnit();
  let best = null, bd = Infinity;
  for (const p of byType('point')) { const d = V.dist(pt, p); if (d <= Math.max(r, p.size + 2) && d < bd) { best = p; bd = d; } }
  return best;
}
function nearestSegment(pt) {
  const r = CONFIG.hitRadius / pxPerUnit();
  let best = null, bd = Infinity;
  for (const s of byType('segment')) { const e = segEnds(s); if (!e) continue; const d = distToSegment(pt, e[0], e[1]); if (d <= r && d < bd) { best = s; bd = d; } }
  return best;
}
/* 선택 도구에서 드래그하면 무엇이 바뀌는지 */
function dragInfoFor(o, pt) {
  if (o.type === 'point' || o.type === 'text') return { kind: 'move', orig: { x: o.x, y: o.y } };
  if (o.type === 'image') return o.locked ? null : { kind: 'move', orig: { x: o.x, y: o.y } };
  if (o.type === 'segment') return groupDragInfo([o.id], pt);   // 선분을 끌면 양 끝점이 함께 움직여요
  if (o.type === 'length') return { kind: 'length' };
  if (o.type === 'angle') { const B = getObj(o.vertex); return B ? { kind: 'radius', center: B, d0: V.dist(pt, B), orig: { radius: o.radius } } : null; }
  if (o.type === 'right' || o.type === 'perp') {
    const G = o.type === 'right' ? rightGeom(o) : perpGeom(o);
    return G ? { kind: 'size', center: G.X, d0: Math.max(1, V.dist(pt, G.X)), orig: { size: o.size } } : null;
  }
  return null;
}

/* 클릭한 곳의 점: 가까운 점, 또는 격자에 맞췄을 때 같은 자리에 이미 있는 점 */
function pointAt(pt) {
  const near = nearestPoint(pt);
  if (near) return near;
  const q = snapPt(pt);
  return byType('point').find(p => V.dist(p, q) < 0.5) || null;
}
let spaceDown = false;   // Space 키를 누르고 있는 동안 끌면 화면 이동

board.addEventListener('pointerdown', e => {
  // 화면 이동: Space+끌기 또는 마우스 가운데 버튼
  if (e.button === 1 || (e.button === 0 && spaceDown)) {
    e.preventDefault();
    drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, moved: true };
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (e.button !== 0) return;
  blurInputs();
  const pt = toBoard(e);
  const handleEl = e.target.closest('[data-handle]');
  const objEl = e.target.closest('[data-id]');
  const hit = objEl ? getObj(objEl.dataset.id) : null;

  // ── 선택 도구
  if (tool === 'select') {
    if (handleEl) {
      const img = getObj(selectedId);
      if (img && img.type === 'image' && !img.locked)
        beginDrag(e, { kind: 'resize', id: img.id, handle: handleEl.dataset.handle, start: pt, orig: { x: img.x, y: img.y, w: img.w, h: img.h } });
      return;
    }
    const lockedImg = hit && hit.type === 'image' && hit.locked;
    // Shift+클릭: 선택에 더하거나 빼기
    if (e.shiftKey && hit && !lockedImg) { toggleSelect(hit.id); return; }
    // 빈 곳(또는 잠긴 그림 위)에서 끌면 네모로 여러 개 선택. 그냥 클릭하면 선택 해제(잠긴 그림이면 그림 선택)
    if (!hit || lockedImg) { beginDrag(e, { kind: 'box', start: pt, clickId: hit ? hit.id : null, add: e.shiftKey }); return; }
    // 여러 개 선택된 것 중 하나를 끌면 함께 이동
    if (multiSel.includes(hit.id)) { const g = groupDragInfo(multiSel, pt); if (g) beginDrag(e, g); return; }
    select(hit.id);
    const info = dragInfoFor(hit, pt);
    if (info) beginDrag(e, { ...info, id: hit.id, start: pt });
    return;
  }

  // ── 점 도구: 그림·선분 위를 눌러도 점이 생깁니다
  if (tool === 'point') {
    const p0 = pointAt(pt);
    if (p0) { select(p0.id); beginDrag(e, { kind: 'move', id: p0.id, start: pt, orig: { x: p0.x, y: p0.y } }); return; }
    record();
    select(addPoint(pt.x, pt.y).id);
    return;
  }

  // ── 문자 도구
  if (tool === 'text') {
    if (hit && hit.type === 'text') { select(hit.id); beginDrag(e, { kind: 'move', id: hit.id, start: pt, orig: { x: hit.x, y: hit.y } }); return; }
    textDialog(pt);
    return;
  }

  // ── 점이나 선분을 차례로 고르는 도구 (선분·길이·각·직각·평행·수직)
  if (TOOLS[tool].pick) handlePick(pt);
});

function handlePick(pt) {
  const T = TOOLS[tool];
  let target, created = false;
  if (T.pick === 'point') {
    target = pointAt(pt);
    if (!target) { record(); target = addPoint(pt.x, pt.y); created = true; }
    if (picks.includes(target.id)) { toast('이미 고른 점이에요. 다른 점을 클릭하세요.', 'warn'); return; }
  } else {
    target = nearestSegment(pt);
    if (!target) { toast(byType('segment').length ? '선분 위를 정확히 클릭해 주세요.' : '먼저 [선분] 도구로 선분을 만들어 주세요.', 'warn'); return; }
    if (picks.includes(target.id)) { toast('이미 고른 선분이에요. 다른 선분을 클릭하세요.', 'warn'); return; }
  }
  picks.push(target.id);
  if (picks.length < T.n) {
    if (created) selectedId = target.id;
    renderAll();
    return;
  }
  const ids = picks; picks = [];
  finishPick(ids, created);
}

/* 필요한 개수를 다 고르면 실제로 만듭니다 */
function finishPick(ids, alreadyRecorded) {
  const rec = () => { if (!alreadyRecorded) record(); };
  const same3 = (o) => o.vertex === ids[1] && ((o.p1 === ids[0] && o.p2 === ids[2]) || (o.p1 === ids[2] && o.p2 === ids[0]));
  const samePair = (o) => (o.segs[0] === ids[0] && o.segs[1] === ids[1]) || (o.segs[0] === ids[1] && o.segs[1] === ids[0]);
  let made = null;
  switch (tool) {
    case 'segment': {
      const ex = byType('segment').find(s => (s.p1 === ids[0] && s.p2 === ids[1]) || (s.p1 === ids[1] && s.p2 === ids[0]));
      if (ex) { toast(`선분 ${segmentName(ex)}은(는) 이미 있어요.`, 'warn'); select(ex.id); return; }
      rec(); made = addSegment(ids[0], ids[1]);
      break;
    }
    case 'length': {
      const ex = byType('length').find(l => l.seg === ids[0]);
      if (ex) { toast('이 선분에는 이미 길이 표시가 있어요. 오른쪽에서 고칠 수 있어요.', 'warn'); select(ex.id); return; }
      renderAll();
      lengthDialog(ids[0]);
      return;
    }
    case 'angle': {
      const ex = byType('angle').find(same3);
      if (ex) { toast('이 각에는 이미 각 표시가 있어요.', 'warn'); select(ex.id); return; }
      rec(); made = addAngle(ids[0], ids[1], ids[2]);
      break;
    }
    case 'right': {
      const ex = byType('right').find(same3);
      if (ex) { toast('이 각에는 이미 직각 표시가 있어요.', 'warn'); select(ex.id); return; }
      rec(); made = addRight(ids[0], ids[1], ids[2]);
      const G = angleGeom(made);
      if (G && Math.abs(G.deg - 90) > 3) toast(`참고: 그림에서 이 각은 약 ${Math.round(G.deg)}°예요. 표시는 그대로 넣었어요.`);
      break;
    }
    case 'parallel': {
      const ex = byType('parallel').find(samePair);
      if (ex) { toast('이 두 선분에는 이미 평행 표시가 있어요.', 'warn'); select(ex.id); return; }
      rec(); made = addParallel(ids[0], ids[1]);
      break;
    }
    case 'perp': {
      const e1 = segEnds(getObj(ids[0])), e2 = segEnds(getObj(ids[1]));
      if (!lineIntersect(e1[0], e1[1], e2[0], e2[1])) { toast('두 선분이 거의 평행해서 수직 표시를 넣을 수 없어요.', 'error'); renderAll(); return; }
      const ex = byType('perp').find(samePair);
      if (ex) { toast('이 두 선분에는 이미 수직 표시가 있어요.', 'warn'); select(ex.id); return; }
      rec(); made = addPerp(ids[0], ids[1]);
      break;
    }
  }
  if (made) select(made.id);
}

board.addEventListener('pointermove', e => {
  if (drag && drag.kind === 'pan') {
    panBy(e.clientX - drag.sx, e.clientY - drag.sy);
    drag.sx = e.clientX; drag.sy = e.clientY;
    return;
  }
  const pt = toBoard(e);
  if (coordOn()) { const m = toMath(pt); $('#coords').textContent = `좌표 (${fmtNum(Math.round(m.x * 10) / 10)}, ${fmtNum(Math.round(m.y * 10) / 10)})`; }
  else $('#coords').textContent = `x ${Math.round(pt.x)} · y ${Math.round(pt.y)}`;
  if (drag) {
    const dx = pt.x - drag.start.x, dy = pt.y - drag.start.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) * pxPerUnit() < 3) return;   // 살짝 떨린 클릭은 이동으로 보지 않음
      drag.moved = true;
      if (drag.kind !== 'box') record();
    }
    if (drag.kind === 'box') { drag.cur = pt; renderOverlay(); return; }
    if (drag.kind === 'group') {
      moveGroup(drag.items, dx, dy);
      if (selectedId) { const so = getObj(selectedId); if (so && so.type === 'point') syncCoordInputs(so); }
      renderCanvas(); return;
    }
    const o = getObj(drag.id); if (!o) return;
    if (drag.kind === 'move') {
      const q = { x: drag.orig.x + dx, y: drag.orig.y + dy };
      const s = o.type === 'point' ? snapPt(q) : { x: round1(q.x), y: round1(q.y) };   // 점은 격자에 맞춰 움직여요
      o.x = s.x; o.y = s.y;
      if (o.type === 'point') syncCoordInputs(o);
    }
    else if (drag.kind === 'resize') resizeImage(o, drag, dx, dy);
    else if (drag.kind === 'length') dragLengthLabel(o, pt);
    else if (drag.kind === 'radius') o.radius = round1(clamp(drag.orig.radius + V.dist(pt, drag.center) - drag.d0, 8, 200));
    else if (drag.kind === 'size') o.size = round1(clamp(drag.orig.size * V.dist(pt, drag.center) / drag.d0, 4, 80));
    renderCanvas();
    return;
  }
  hover.pos = pt;
  const T = TOOLS[tool];
  hover.pointId = (tool === 'point' || T.pick === 'point') ? (pointAt(pt) || {}).id || null : null;
  hover.segId = T.pick === 'segment' ? (nearestSegment(pt) || {}).id || null : null;
  if (tool === 'select') {
    const el = e.target.closest('[data-id]'), id = el ? el.dataset.id : null;
    const ho = getObj(id);
    const nid = ho && !(ho.type === 'image' && ho.locked) ? id : null;   // 잠긴 그림은 미리보기 안 함
    if (nid !== hover.objId) { hover.objId = nid; renderOverlay(); }
  }
  if (tool === 'point' || T.pick) renderOverlay();
});

/* 길이 글자를 끌면: 선분을 따라 위치(t)와 선분에서 떨어진 거리(offset)가 바뀝니다 */
function dragLengthLabel(o, pt) {
  const G = lengthGeom(o); if (!G) return;
  const L = V.dist(G.A, G.B);
  if (o.style !== 'brace') o.t = round1(clamp(V.dot(V.sub(pt, G.A), G.d) / L, 0.05, 0.95) * 100) / 100;
  const base = V.lerp(G.A, G.B, o.style === 'brace' ? 0.5 : o.t);
  const perp = V.dot(V.sub(pt, base), G.n), s = perp >= 0 ? 1 : -1;
  let off = perp - s * (G.ext + (o.style === 'brace' ? 5 : 0));
  const min = o.style === 'brace' ? 6 : 1;
  if (s * off < min) off = s * min;
  o.offset = round1(off);
}

function endDrag() {
  if (!drag) return;
  const d = drag, moved = drag.moved, kind = drag.kind; drag = null;
  if (kind === 'box') {
    if (!moved) {   // 그냥 클릭: 선택 해제 (잠긴 그림 위였다면 그림 선택)
      if (d.add) return;
      select(d.clickId);
      if (d.clickId) setTempHint('🔒 잠긴 그림이라 움직이지 않아요. 옮기려면 오른쪽 속성창에서 잠금을 해제하세요. (끌면 여러 개를 고를 수 있어요)');
      return;
    }
    const ids = objectsInBox(d.start, d.cur || d.start);
    selectMany(d.add ? [...selectionIds(), ...ids] : ids);
    if (ids.length > 1) toast(`개체 ${ids.length}개를 선택했어요. 끌면 함께 움직이고, Delete로 함께 지워요.`);
    return;
  }
  if (moved && kind !== 'pan') { renderPanel(); renderCanvas(); }
}
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);
board.addEventListener('pointerleave', () => {
  if (drag) return;
  hover = { pos: null, pointId: null, segId: null, objId: null }; $('#coords').textContent = '';
  renderOverlay();
});

/* 그림 크기 조절 (모서리 손잡이: 비율 유지 가능 / 변 손잡이: 가로 또는 세로만) */
function resizeImage(o, d, dx, dy) {
  const MIN = 10, h = d.handle, g = d.orig;
  let left = g.x, top = g.y, right = g.x + g.w, bottom = g.y + g.h;
  if (h.includes('w')) left += dx;
  if (h.includes('e')) right += dx;
  if (h.includes('n')) top += dy;
  if (h.includes('s')) bottom += dy;
  let w = right - left, hh = bottom - top;
  if (o.keepRatio && h.length === 2) {
    const s = Math.max(MIN / Math.min(g.w, g.h), (w * g.w + hh * g.h) / (g.w * g.w + g.h * g.h));
    w = g.w * s; hh = g.h * s;
    if (h.includes('w')) left = right - w; else right = left + w;
    if (h.includes('n')) top = bottom - hh; else bottom = top + hh;
  } else {
    if (w < MIN) { if (h.includes('w')) left = right - MIN; w = MIN; }
    if (hh < MIN) { if (h.includes('n')) top = bottom - MIN; hh = MIN; }
  }
  o.x = round1(left); o.y = round1(top); o.w = round1(w); o.h = round1(hh);
}

/* ================================================================
   [문자 · 길이 입력 창]
   ================================================================ */
function textDialog(pt) {
  inputDialog({
    title: '문자 넣기', placeholder: '예: x, ∠A, 10 cm, 3', chips: CONFIG.symbols, okLabel: '넣기',
    onOk: v => { record(); const t = addText(pt.x, pt.y, v); select(t.id); },
  });
}
function lengthDialog(segId) {
  const name = segmentName(getObj(segId));
  let format = (userDefaults.length || {}).format || CONFIG.length.format;
  const prev = H('div', { class: 'live-preview' });

/* ================================================================
   [삭제]
   ================================================================ */
function deleteSelected() {
  const all = selectionIds().map(getObj);
  if (!all.length) { toast('지울 개체를 먼저 클릭해서 선택하세요.'); return; }
  const locked = all.filter(o => o.type === 'image' && o.locked);
  const targets = all.filter(o => !locked.includes(o));
  if (!targets.length) { toast('🔒 잠긴 그림은 지울 수 없어요. 먼저 잠금을 해제하세요.', 'warn'); return; }
  const label = targets.length === 1 ? objLabel(targets[0]) : `개체 ${targets.length}개`;
  record();
  const gone = new Set();
  for (const o of targets) withDependents(o.id).forEach(id => gone.add(id));
  doc.objects = doc.objects.filter(x => !gone.has(x.id));
  picks = picks.filter(id => !gone.has(id));
  const extra = gone.size - targets.length;
  const obj = targets.length === 1 ? label + '을(를)' : label + '를', withP = targets.length === 1 ? label + '와(과)' : label + '와';
  toast((extra ? `${withP} 연결된 선분·표시 ${extra}개를 함께 지웠어요.` : `${obj} 지웠어요.`) + ' (되돌리기: Ctrl+Z)'
    + (locked.length ? ' 잠긴 그림은 남겨 두었어요.' : ''));
  select(null);
}

/* ================================================================
   [복사 · 붙여넣기 · 복제]  Ctrl+C / Ctrl+X / Ctrl+V / Ctrl+D
   선분·표시를 복사하면 거기에 연결된 점도 함께 복사됩니다.
   ================================================================ */
let clip = null;            // 프로그램 안의 복사 보관함
const CLIP_MARK = 'GEO-EDITOR-CLIP';
function copySelection() {
  const ids = selectionIds(); if (!ids.length) return false;
  const keep = new Set();
  const add = id => { if (keep.has(id)) return; const o = getObj(id); if (!o) return; keep.add(id); refsOf(o).forEach(add); };
  ids.forEach(add);
  clip = { objects: doc.objects.filter(o => keep.has(o.id)).map(o => JSON.parse(JSON.stringify(o))), pasted: 0 };
  return true;
}
function pasteClip() {
  if (!clip || !clip.objects.length) { toast('붙여 넣을 개체가 없어요. 먼저 복사(Ctrl+C)하세요.'); return; }
  record();
  clip.pasted++;
  const step = (coordOn() && doc.coord.snap ? doc.coord.unit * Math.max(doc.coord.snap, 0.5) : 20) * clip.pasted;   // 겹치지 않게 조금씩 비켜서
  const map = {};
  for (const o of clip.objects) map[o.id] = newId();
  const fresh = [];
  for (const src of clip.objects) {
    const o = JSON.parse(JSON.stringify(src));
    o.id = map[src.id];
    for (const k of ['p1', 'p2', 'vertex', 'seg']) if (o[k]) o[k] = map[o[k]] || o[k];
    if (o.segs) o.segs = o.segs.map(s => map[s] || s);
    if ('x' in o) { o.x = round1(o.x + step); o.y = round1(o.y + step); }
    if (o.type === 'point') o.name = nextPointName();
    if (o.type === 'image') o.locked = false;
    doc.objects.push(o); fresh.push(o.id);
  }
  // 그림은 늘 맨 뒤에 깔리도록 정리
  doc.objects.sort((a, b) => (a.type === 'image' ? 0 : 1) - (b.type === 'image' ? 0 : 1));
  if (tool !== 'select') setTool('select');
  selectMany(fresh);
  toast(`개체 ${fresh.length}개를 붙여 넣었어요. 끌어서 원하는 곳으로 옮기세요.`, 'ok');
}
function duplicateSelection() {
  if (!copySelection()) { toast('복제할 개체를 먼저 선택하세요.'); return; }
  pasteClip();
}
document.addEventListener('copy', e => {
  if (modalEl || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (!copySelection()) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain', CLIP_MARK);   // 붙여넣기 때 '그림'이 아니라 '개체'임을 알아보는 표시
  toast(`개체를 복사했어요. Ctrl+V로 붙여 넣으세요.`);
});
document.addEventListener('cut', e => {
  if (modalEl || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (!copySelection()) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain', CLIP_MARK);
  clip.pasted = -1;   // 잘라낸 것은 같은 자리에 붙여 넣기
  deleteSelected();
});

  const out = H('span', { class: 'slider-val' }, fmt(value));
  const inp = H('input', { type: 'range', min, max, step, value, disabled,
    oninput: e => { const v = +e.target.value; out.textContent = fmt(v); onInput(v); } });

}
function toggle(label, value, onChange) {

        act('가운데로', '종이 가운데로 옮겨요', () => { o.x = round1((CONFIG.paper.width - o.w) / 2); o.y = round1((CONFIG.paper.height - o.h) / 2); }),
