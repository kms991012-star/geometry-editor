      toggle('원본 그림 보이기 (끄면 화면·PNG에서 빠져요)', o.visible !== false, v => { hist.lastKey = null; record(); o.visible = v; renderAll(); }),
      field('투명도 (낮출수록 흐려져요)', slider({ min: 0, max: 100, value: Math.round(o.opacity * 100), unit: '%', onInput: v => setProp(o, 'opacity', v / 100) })),
      groupTitle('🤖 AI 도형 인식'),
      H('button', { class: 'big-btn accent', disabled: aiBusy, title: '그림 속 점·선·표시를 고칠 수 있는 개체로 바꿔요', onclick: () => aiStart(o) },
        aiBusy ? '⏳ AI가 분석하는 중…' : aiMade.length ? '🔄 AI로 다시 인식하기' : '🤖 AI로 도형 인식하기'),
      H('div', { class: 'btn-row' },
        H('button', { class: 'small-btn', disabled: aiBusy, title: '그림 위를 끌어서 고른 부분만 AI가 인식해요', onclick: () => aiRegionStart(o) }, '✂ 선택 영역 AI 인식'),
        H('button', { class: 'small-btn', title: '접속 비밀번호·좌표 보정·연결 시험', onclick: () => aiSettingsDialog() }, '⚙ AI 설정')),
      aiMade.length ? H('button', { class: 'big-btn', title: '이 그림에서 인식해 만든 개체만 골라요', onclick: () => { selectMany(aiMade.map(x => x.id)); } },
        `이 그림에서 인식한 개체 ${aiMade.length}개 선택`) : null,
      H('div', { class: 'info' }, `💡 AI(Google Gemini 무료 등급)는 버튼을 누를 때만 그림을 분석해요. 무료 한도를 넘으면 멈추고 알려 드려요. 결과를 확인하고 고른 것만 개체로 만들어요.`,
        H('div', { class: 'ai-count' }, `이번 사용: AI 인식 ${aiCallCount()}회 (이 창에서 보낸 횟수, 남은 무료 한도 아님)`)),
      H('button', { class: 'small-btn', style: 'width:100%;margin:-6px 0 15px', title: '다른 AI 채팅(Gemini 앱 등)에서 받은 결과를 붙여 넣어요', onclick: () => aiPasteDialog(o) }, '📋 다른 AI 결과 붙여넣기'),
      groupTitle('그림 크기·위치'),
      field('크기', scale),
      field('너비 × 높이 (픽셀)', H('div', { class: 'wh' }, wIn, '×', hIn)),
      L ? null : toggle('가로·세로 비율 유지', o.keepRatio, v => setProp(o, 'keepRatio', v)),
      H('div', { class: 'btn-row' },
        act('종이 맞춤', '종이 크기에 맞게 키우거나 줄여요', () => fitImage(o)),
        act('가운데로', '종이 가운데로 옮겨요', () => { o.x = round1((CONFIG.paper.width - o.w) / 2); o.y = round1((CONFIG.paper.height - o.h) / 2); }),
        act('원래 비율', '찌그러진 그림을 원래 비율로 되돌려요', () => { const a = assets[o.asset]; if (a) o.h = round1(o.w * a.h / a.w); })),
      deleteButton(o),
    ];
  },
};

/* 개체 목록 (숨긴 개체도 여기서 선택할 수 있어요) */
const LIST_ORDER = ['image', 'point', 'segment', 'line', 'circle', 'arc', 'polygon', 'arrow', 'text', 'length', 'angle', 'right', 'parallel', 'perp'];
function renderList() {
  const box = $('#objList'); box.replaceChildren();
  if (!doc.objects.length) { box.append(H('div', { class: 'list-empty' }, '아직 아무것도 없어요.')); return; }
  const items = [...doc.objects].sort((a, b) => LIST_ORDER.indexOf(a.type) - LIST_ORDER.indexOf(b.type));
  for (const o of items) {
    const tags = [];
    if (o.type === 'image') tags.push(o.locked ? '🔒 잠김' : '잠금 해제');
    if (o.visible === false) tags.push('숨김');
    if (o.ai) tags.push('AI');
    box.append(H('div', { class: 'list-item' + (isSelected(o.id) ? ' on' : ''), title: 'Shift+클릭: 여러 개 고르기', onclick: ev => { if (tool !== 'select') setTool('select'); ev.shiftKey ? toggleSelect(o.id) : select(o.id); } },
      H('span', { class: 'li-ic' }, icon(o.type, 'ic')), objLabel(o), H('span', { class: 'tag' }, tags.join(' · '))));
  }
  const on = box.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}

function renderAll() {
  renderCanvas(); renderPanel(); renderList(); updateUndoButtons(); updateHint(); updateCoordButton(); updateImageButton();
}

/* ================================================================
   [그림 불러오기] 파일 선택 · 끌어다 놓기 · 붙여넣기(Ctrl+V)
   ================================================================ */
const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/bmp'];
function insertImageFile(file) {
  if (!file) return;
  if (!IMAGE_TYPES.includes(file.type)) { toast('PNG 또는 JPG 그림 파일만 불러올 수 있어요.', 'error'); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('파일을 읽지 못했어요. 다른 그림으로 다시 시도해 주세요.', 'error');
  reader.onload = async () => {
    try {
      const src = reader.result;
      const im = await loadImg(src).catch(() => { throw new UserError('그림을 열 수 없어요. 파일이 손상되었거나 지원하지 않는 형식이에요.'); });
      const assetId = 'img' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      assets[assetId] = { src, w: im.naturalWidth, h: im.naturalHeight };
      record();
      const o = { id: newId(), type: 'image', asset: assetId, x: 0, y: 0, w: im.naturalWidth, h: im.naturalHeight,
        baseW: 1, baseH: 1, opacity: 1, locked: false, keepRatio: true };
      fitImage(o);
      o.baseW = o.w; o.baseH = o.h;
      // 그림은 항상 점·선 뒤에 깔리도록 그림들 바로 다음에 넣습니다
      const lastImg = doc.objects.map(x => x.type).lastIndexOf('image');
      doc.objects.splice(lastImg + 1, 0, o);
      if (tool !== 'select') setTool('select');
      select(o.id);
      toast('그림을 불러왔어요! 위치·크기를 맞춘 뒤 오른쪽의 🔒 잠금을 누르면 편해요.', 'ok');
    } catch (err) { showError(err); }
  };
  reader.readAsDataURL(file);
}
function fitImage(o) {
  const a = assets[o.asset]; if (!a) return;
  const { width: W, height: Hh } = CONFIG.paper, r = CONFIG.image.fitRatio;
  const s = Math.min(W * r / a.w, Hh * r / a.h);
  o.w = round1(a.w * s); o.h = round1(a.h * s);
  o.x = round1((W - o.w) / 2); o.y = round1((Hh - o.h) / 2);
}
function handleFiles(files, fromOpen = false) {
  const f = files && files[0]; if (!f) return;
  if (f.name.toLowerCase().endsWith('.json')) { f.text().then(t => openProjectText(t, f.name)); return; }
  loadImageFile(f, fromOpen);
}

$('#btnImage').onclick = () => $('#fileImage').click();
$('#fileImage').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
$('#fileProject').onchange = e => { handleFiles(e.target.files, true); e.target.value = ''; };

const wrap = $('#canvasWrap');
wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('dragover'); });
wrap.addEventListener('dragleave', e => { if (e.target === wrap || !wrap.contains(e.relatedTarget)) wrap.classList.remove('dragover'); });
wrap.addEventListener('drop', e => { e.preventDefault(); wrap.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
document.addEventListener('paste', e => {
  if (modalEl || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const data = e.clipboardData;
  // 이 프로그램에서 복사한 개체면 개체를, 캡처한 그림이면 그림을 붙여 넣어요
  if (data && data.getData('text/plain') === CLIP_MARK && clip) { e.preventDefault(); pasteClip(); return; }
  const item = [...(data ? data.items : [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); insertImageFile(item.getAsFile()); return; }
  if (clip) { e.preventDefault(); pasteClip(); }
});

/* ================================================================
   [AI 도형 인식]  그림 속 도형 → 고칠 수 있는 개체
   흐름:  원본 그림(image 개체)
          → 인식기 AI_RECOGNIZERS (지금: 결과 붙여넣기 / 나중: 자동 인식 모델)
          → 인식 결과(raw JSON, 아래 AI_PROMPT의 형식)
          → normalizeRecognitionResult()  : 형식 검사·종이 좌표로 변환·점 이름 붙이기 → 후보 목록
          → reviewRecognitionDialog()     : 사용자가 체크해서 고름 (화면에 주황 점선 미리보기)
          → applyRecognition()            : 수동 도구와 같은 add…() 함수로 doc.objects에 추가
   - AI가 만든 점 A와 직접 찍은 점 A는 완전히 같은 개체예요. 출처 기록 o.ai = { image, conf } 만 더 붙어요.
   - 원본 그림은 그대로 남아요 (숨기기·투명도·잠금). 인식 결과는 그림과 별개의 개체예요.
   - 새 인식기 연결: AI_RECOGNIZERS에 { label, ready: true, async recognize(input) → raw } 추가 → runRecognition()
   - 새 종류 추가: 결과 읽기는 AI_PARSERS, 만들기·이름은 AI_KINDS에 한 줄씩
   - 일부만 다시 인식: recognitionInput(img, region)으로 잘라 보내고, 결과의 region으로 제자리에 놓여요
   ================================================================ */
/* 다른 AI 채팅(Gemini 앱 등)에 그림과 함께 보낼 요청문 = 인식 결과 형식 설명서 */
const AI_PROMPT = `첨부한 수학 문제 그림을 분석해서, 그림 속 도형을 아래 형식의 JSON으로만 알려 주세요. (설명 문장 없이 JSON만)
좌표는 그림 왼쪽 위가 (0, 0)인 픽셀 좌표이고, 오른쪽이 +x, 아래쪽이 +y예요.
픽셀 크기를 정확히 모르면 "units": "ratio"로 적고 0~1 사이 비율로 적어도 돼요.
{
  "image": { "width": 그림 너비, "height": 그림 높이 },
  "objects": [
    { "id": "A", "type": "point", "label": "A", "x": 120, "y": 340, "confidence": 0.95 },
    { "type": "segment", "from": "A", "to": "B", "dashed": false, "heads": "none" },
    { "type": "line", "through": ["A", "B"] },
    { "type": "ray", "from": "A", "through": "B" },
    { "type": "triangle", "points": ["A", "B", "C"] },
    { "type": "circle", "center": "O", "through": "A" },
    { "type": "arc", "center": "O", "from": "A", "to": "B" },
    { "type": "angle", "points": ["A", "B", "C"], "value": "60°" },
    { "type": "rightAngle", "points": ["A", "B", "C"] },
    { "type": "parallel", "segments": [["A", "D"], ["B", "C"]], "count": 1 },
    { "type": "perpendicular", "segments": [["A", "B"], ["C", "D"]] },
    { "type": "length", "segment": ["A", "B"], "value": "5" },
    { "type": "dimension", "between": ["A", "B"], "value": "7" },
    { "type": "text", "text": "x", "x": 200, "y": 150 },
    { "type": "label", "text": "D", "x": 410, "y": 90 },
    { "type": "arrow", "from": [300, 80], "to": [360, 80], "heads": "end" }
  ]
}
규칙:
- 각(angle, rightAngle)의 points는 가운데 점이 꼭짓점이에요.
- 점 이름을 모르면 label을 비워 두세요. 점과 떨어져 있는 이름 글자는 "label"로 적으면 가까운 점의 이름이 돼요.
- 점선은 "dashed": true, 치수선(양쪽 화살표와 길이)은 "dimension"으로 적어 주세요.
- 화살표는 "arrow"로, 꼬리(from)와 머리(to)를 적어요. 양쪽 화살표면 "heads": "both".
- 같은 길이 표시(|, ||)가 있는 선분은 segment에 "ticks": 1~3을 적어요. 호(arc)는 화면에서 시계 반대 방향으로 from → to예요.
- 두 점을 잇는 선분 끝에 화살촉이 있으면 segment에 "heads"를 적어요: "end"(to 쪽), "start"(from 쪽), "both".
- 확실하지 않은 항목은 "confidence"를 0~1 사이로 낮게 적어 주세요.`;

/* 인식기 목록: auto = AI 서버(api/recognize.js)로 그림을 보내 자동 인식, paste = 다른 AI 결과 붙여넣기
   다른 인식 방법을 더하려면 { label, ready: true, async recognize(input, { signal }) → raw } 를 추가 */
const AI_RECOGNIZERS = {
  paste: { label: 'AI 결과 붙여넣기', ready: true },   // 화면에서 직접 처리 (aiPasteDialog)
  auto: { label: 'AI 자동 인식', ready: true, recognize: (input, opt) => analyzeGeometryImage(input, opt) },
};

/* ---------- AI 설정: 이 컴퓨터 브라우저에만 저장 (접속 비밀번호·서버 주소·좌표 보정) ----------
   API 키는 여기 없어요. API 키는 서버(Vercel 환경변수)에만 있어서 브라우저에 보이지 않아요. */
const AI_DEFAULT_SERVER = 'https://geometry-editor.vercel.app/api/recognize';
function aiSettings() { return { code: '', server: '', refine: true, ...(store.get('aiSettings') || {}) }; }
function aiServerUrl() {
  const s = (aiSettings().server || '').trim(); if (s) return s;
  // 웹 주소(Vercel)나 내 PC 시험 서버로 열었으면 같은 곳의 /api, 파일로 열었거나 GitHub Pages면 Vercel 서버
  return /^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname) ? new URL('/api/recognize', location.href).href : AI_DEFAULT_SERVER;
}
/* 서버가 알려 준 오류 종류 → 쉬운 안내 */
const AI_ERRORS = {

  ai_down: 'Gemini 서버가 지금 바빠요. 잠시 후 다시 시도해 주세요.',
  network: 'AI 인식에 실패했어요. 인터넷 연결이나 AI 설정을 확인해 주세요.',
  not_found: 'AI 서버를 찾을 수 없어요. [⚙ AI 설정]의 서버 주소를 확인해 주세요.',
  server: 'AI 인식에 실패했어요. 잠시 후 다시 시도해 주세요.',

class AiError extends UserError { constructor(code, retryAfter = null) { super(AI_ERRORS[code] || AI_ERRORS.server); this.code = code; this.retryAfter = retryAfter; } }

/* ---------- 무료 한도 보호: 한도에 걸리면 그 시간까지 AI를 부르지 않아요 (이 컴퓨터 브라우저에 기억) ---------- */
function nextPacificMidnight() {   // Gemini 하루 한도는 미국 태평양 시간 자정에 다시 채워져요
  const now = new Date();
  const part = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(now);
  const v = t => +(part.find(x => x.type === t) || { value: 0 }).value;
  return now.getTime() + 86400000 - ((v('hour') * 60 + v('minute')) * 60 + v('second')) * 1000;
}
function aiBlocked() {
  const b = store.get('aiBlock');
  if (!b || !(b.until > Date.now())) return null;
  const at = new Date(b.until).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const secs = Math.ceil((b.until - Date.now()) / 1000);
  return b.kind === 'day'
    ? `오늘 Gemini 무료 등급 한도를 다 써서 AI 인식을 멈췄어요. ${at}쯤부터 다시 쓸 수 있어요. (요금은 들지 않아요)`
    : `Gemini 무료 등급의 1분 한도에 걸려서 잠시 멈췄어요. ${secs}초 뒤에 다시 눌러 주세요.`;
}
function aiRememberQuota(err) {
  if (err.code === 'quota_day') store.set('aiBlock', { kind: 'day', until: nextPacificMidnight() });
  else if (err.code === 'quota_minute') store.set('aiBlock', { kind: 'minute', until: Date.now() + Math.max(20, err.retryAfter || 60) * 1000 });
}
/* 이번에 AI를 부른 횟수 (이 창을 닫으면 0부터) — Google의 남은 무료 한도가 아니에요 */
let aiBusy = false, aiLastStart = 0;
const aiCallCount = () => +(sessionStorage.getItem('geoEditor.aiCalls') || 0);
function aiCountCall() { try { sessionStorage.setItem('geoEditor.aiCalls', String(aiCallCount() + 1)); } catch (_) {} }
async function postAi(body, signal) {
  let res;
  try { res = await fetch(aiServerUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal }); }
  catch (err) { if (err && err.name === 'AbortError') throw err; throw new AiError('network'); }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!data || typeof data !== 'object') throw new AiError(res.status === 404 ? 'not_found' : res.status === 413 ? 'too_large' : res.status === 504 ? 'timeout' : 'server');
  if (!data.ok) { const e = new AiError(data.error, data.retryAfter); aiRememberQuota(e); throw e; }
  return data;
}

/* 인식기에 넘길 그림: 원본 전체 또는 일부(region, 원본 픽셀 기준)
   흰 바탕에 그려서 AI가 읽기 좋은 크기로(너무 크면 줄이고 작으면 키움) → PNG(크면 JPG)
   → { mediaType, data(base64), width, height, region, canvas } — 결과 좌표는 이 그림(width×height)의 픽셀 기준 */
async function recognitionInput(img, region = null) {
  const a = assets[img.asset]; if (!a) throw new UserError('원본 그림을 찾을 수 없어요.');
  const r = region || { x: 0, y: 0, width: a.w, height: a.h };
  const im = await loadImg(a.src).catch(() => { throw new UserError('원본 그림을 읽을 수 없어요.'); });
  const C = CONFIG.ai, long = Math.max(r.width, r.height);
  let s = long > C.maxSide ? C.maxSide / long : long < C.minSide ? Math.min(C.maxUpscale, C.minSide / long) : 1;
  for (let tries = 0; tries < 5; tries++, s *= 0.75) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(r.width * s)); c.height = Math.max(1, Math.round(r.height * s));
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(im, r.x, r.y, r.width, r.height, 0, 0, c.width, c.height);
    for (const [type, q] of [['image/png'], ['image/jpeg', 0.92]]) {
      const dataUrl = c.toDataURL(type, q), data = dataUrl.slice(dataUrl.indexOf(',') + 1);
      if (data.length <= C.maxBase64) return { mediaType: type, data, dataUrl, width: c.width, height: c.height, region, canvas: c };
    }
  }
  throw new AiError('too_large');
}
/* AI 호출: 그림 → AI 서버 → 표준 결과(raw: { image, region, objects }) — 어떤 AI를 쓰는지는 서버가 정해요 */
async function analyzeGeometryImage(input, { signal } = {}) {
  const data = await postAi({ code: aiSettings().code, image: { mediaType: input.mediaType, data: input.data, width: input.width, height: input.height } }, signal);
  const raw = data.result && typeof data.result === 'object' ? data.result : { objects: [] };
  raw.image = { width: input.width, height: input.height };   // 보낸 그림 크기 기준 좌표 (AI가 적은 크기보다 확실해요)
  if (input.region) raw.region = input.region;
  return raw;
}

/* ---------- 좌표 자동 보정: AI가 찍은 점을 '그림 속 선이 실제로 지나는 곳'으로 살짝 옮겨요 ----------
   점마다 연결된 선분 방향으로 그림의 어두운 픽셀(선)이 얼마나 이어지는지 재서, 가까운 범위에서 가장 잘 맞는 자리로.
   글자나 다른 표시 쪽으로는 끌려가지 않아요(선이 이어지는 방향만 보니까). 옮긴 점 개수를 돌려줘요. */
function refineRecognition(raw, canvas) {
  const W = canvas.width, Hh = canvas.height, N = W * Hh;
  const px = canvas.getContext('2d').getImageData(0, 0, W, Hh).data;
  const lum = new Uint8Array(N), hist = new Float64Array(256);
  for (let i = 0; i < N; i++) { const v = (px[i * 4] * 299 + px[i * 4 + 1] * 587 + px[i * 4 + 2] * 114) / 1000 | 0; lum[i] = v; hist[v]++; }
  // 오츠 방법으로 '선'과 '바탕'을 가르는 밝기 기준
  let sum = 0; for (let v = 0; v < 256; v++) sum += v * hist[v];
  let wB = 0, sB = 0, best = 0, th = 128;
  for (let v = 0; v < 256; v++) {
    wB += hist[v]; if (!wB || wB === N) continue;
    sB += v * hist[v];
    const mB = sB / wB, mF = (sum - sB) / (N - wB), between = wB * (N - wB) * (mB - mF) * (mB - mF);
    if (between > best) { best = between; th = v; }
  }
  th = Math.min(th, 200);
  // 진하기 지도: 바탕(밝음) = 0 … 선 한가운데(가장 진함) = 1 → 선의 '가운데'에 맞출 수 있어요
  const hi = Math.max(th, 140), ink = new Float32Array(N);
  for (let i = 0; i < N; i++) ink[i] = clamp((hi - lum[i]) / (hi - 30), 0, 1);
  const at = (x, y) => { x = Math.round(x); y = Math.round(y); return x >= 0 && y >= 0 && x < W && y < Hh ? ink[y * W + x] : 0; };
  const support = (p, q) => {   // p에서 q 쪽으로 절반까지, 선 위를 지나는 정도(평균 진하기)
    const L = Math.hypot(q.x - p.x, q.y - p.y); if (L < 4) return 0;
    const n = clamp(Math.round(L / 4), 8, 60); let hit = 0;
    for (let i = 1; i <= n; i++) { const t = 0.5 * i / n; hit += at(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t); }
    return hit / n;
  };
  const objs = Array.isArray(raw.objects) ? raw.objects : [];
  const pts = new Map(), byLabel = new Map();
  for (const o of objs) if (o && o.type === 'point' && isFinite(+o.x) && isFinite(+o.y)) { pts.set(String(o.id), o); if (o.label) byLabel.set(String(o.label), o); }
  const ref = r => typeof r === 'string' ? (pts.get(r) || byLabel.get(r) || null) : null;
  const nbrs = new Map();
  const link = (a, b) => { a = ref(a); b = ref(b); if (!a || !b || a === b) return; for (const [p, q] of [[a, b], [b, a]]) { if (!nbrs.has(p)) nbrs.set(p, new Set()); nbrs.get(p).add(q); } };
  for (const o of objs) {
    if (!o) continue;
    if (o.type === 'segment') link(o.from, o.to);
    else if (o.type === 'polygon' && Array.isArray(o.points)) o.points.forEach((p, i) => link(p, o.points[(i + 1) % o.points.length]));
    else if (o.type === 'line' && Array.isArray(o.through)) link(o.through[0], o.through[1]);
    else if (o.type === 'ray') link(o.from, o.through);
  }
  const R = Math.max(5, Math.round(Math.max(W, Hh) * 0.02));
  const moved = new Set();
  for (const p of nbrs.keys()) p._x0 = +p.x, p._y0 = +p.y;
  for (let round = 0; round < 2; round++) for (const [p, set] of nbrs) {
    const list = [...set];
    const score = (x, y) => list.reduce((s, q) => s + support({ x, y }, q), 0) / list.length + at(x, y) * 0.05 - 0.002 * Math.hypot(x - p._x0, y - p._y0);
    const cur = score(+p.x, +p.y);
    let bx = +p.x, by = +p.y, bs = -Infinity;
    for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) { const s = score(p._x0 + dx, p._y0 + dy); if (s > bs) { bs = s; bx = p._x0 + dx; by = p._y0 + dy; } }
    const cx = bx, cy = by;   // 2칸 간격으로 찾은 곳 주변을 1칸 간격으로 다시
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const s = score(cx + dx, cy + dy); if (s > bs) { bs = s; bx = cx + dx; by = cy + dy; } }
    if (bs >= 0.45 && bs > cur + 0.02 && (bx !== +p.x || by !== +p.y)) { p.x = bx; p.y = by; moved.add(p); }
  }
  for (const p of nbrs.keys()) { delete p._x0; delete p._y0; }
  return moved.size;
}

/* 자동 인식 실행: 그림 준비 → AI 분석(기다리는 동안 안내) → 좌표 보정 → 결과 정리 → 검토 창
   AI는 이 함수가 불릴 때(= 사용자가 버튼을 눌렀을 때)만 호출돼요. 그림을 불러오기만 해서는 호출되지 않아요. */
async function runRecognition(img, recognizerId = 'auto', region = null, opt = {}) {
  const R = AI_RECOGNIZERS[recognizerId];
  if (!R || !R.ready || !R.recognize) throw new UserError('이 인식 방법은 아직 쓸 수 없어요.');
  if (aiBusy) return;                                   // 분석 중에는 다시 부르지 않아요
  const blocked = aiBlocked(); if (blocked) throw new UserError(blocked);   // 무료 한도에 걸린 동안은 부르지 않아요
  aiBusy = true; renderPanel();   // 버튼 잠금
  const ctrl = new AbortController();
  let finished = false, timedOut = false;
  const t0 = Date.now();
  const elapsed = H('p', { class: 'ai-sub' }, '보통 20초~1분쯤 걸려요.');
  openModal({ title: '🤖 AI 도형 인식', width: 420,
    body: H('div', { class: 'ai-loading' }, H('div', { class: 'ai-spin' }), H('p', { class: 'ai-busy' }, 'AI가 도형을 분석하고 있습니다...'), elapsed),
    buttons: [{ label: '취소' }], onClose: () => { if (!finished) ctrl.abort(); } });
  const loading = modalEl;
  const tick = setInterval(() => { elapsed.textContent = `${Math.round((Date.now() - t0) / 1000)}초 지났어요. 보통 20초~1분쯤 걸려요.`; }, 1000);
  const limit = setTimeout(() => { timedOut = true; ctrl.abort(); }, CONFIG.ai.timeoutSec * 1000);
  try {
    const input = await recognitionInput(img, region);
    aiCountCall();
    const raw = await R.recognize(input, { signal: ctrl.signal });
    if (ctrl.signal.aborted) throw Object.assign(new Error('aborted'), { name: 'AbortError' });
    let fixed = 0;
    if (aiSettings().refine && input.canvas && raw.units !== 'ratio') { try { fixed = refineRecognition(raw, input.canvas); } catch (e) { console.warn(e); } }
    const norm = normalizeRecognitionResult(raw, img);
    finished = true;
    if (modalEl !== loading) return;   // 기다리다 창을 닫았으면 아무것도 하지 않아요
    if (!norm.cands.length) { closeModal(); throw new UserError('그림에서 도형을 찾지 못했어요. 그림이 흐리거나 작다면 [✂ 선택 영역 AI 인식]으로 도형 부분만 골라 보세요.'); }
    Object.assign(norm, { refined: fixed, replaceAi: !!opt.replace });
    reviewRecognitionDialog(norm);
  } catch (err) {
    finished = true;
    if (modalEl === loading) closeModal();
    if (err && err.name === 'AbortError') { if (timedOut) throw new AiError('timeout'); toast('AI 인식을 취소했어요.'); return; }
    throw err;
  } finally { clearInterval(tick); clearTimeout(limit); aiBusy = false; renderPanel(); }
}

/* ---------- 결과 정리: 인식 결과(raw) → 후보 목록 ----------
   후보 = { key, kind, data, conf, deps:[필요한 후보 key], supported, src(원래 종류) }
   data의 좌표는 이미 '종이 좌표'(px), 점·선분은 후보 key로 서로 가리켜요. */
const AI_TYPE_ALIAS = {
  point: 'point', vertex: 'point', segment: 'segment', linesegment: 'segment', line: 'line', straightline: 'line',
  ray: 'ray', halfline: 'ray', triangle: 'polygon', quadrilateral: 'polygon', rectangle: 'polygon', square: 'polygon',
  polygon: 'polygon', circle: 'circle', angle: 'angle', rightangle: 'right', right: 'right', parallel: 'parallel',
  parallelmark: 'parallel', perpendicular: 'perp', perp: 'perp', length: 'length', dimension: 'dimension',
  dimensionline: 'dimension', text: 'text', number: 'text', symbol: 'text', char: 'text', letter: 'text',
  label: 'label', pointlabel: 'label', arrow: 'arrow', doublearrow: 'arrow', arc: 'arc',
};
const AI_STAGE = { point: 0, label: 1, segment: 2, line: 2, ray: 2, polygon: 2, circle: 2, arc: 2 };   // 나머지는 3 (점·선을 먼저 읽어야 표시가 가리킬 수 있어요)
function normalizeRecognitionResult(raw, img) {
  if (typeof raw === 'string') {
    const s = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');   // AI가 ```json으로 감싸 줘도 읽어요
    try { raw = JSON.parse(s); } catch (_) { throw new UserError('결과를 읽을 수 없어요. AI가 준 JSON을 처음 { 부터 끝 } 까지 그대로 붙여 넣어 주세요.'); }
  }
  if (Array.isArray(raw)) raw = { objects: raw };
  const list = raw && (raw.objects || raw.items || raw.shapes || raw.elements);
  if (!Array.isArray(list)) throw new UserError('결과에 "objects" 목록이 없어요.');
  const a = assets[img.asset] || { w: img.w, h: img.h };
  const reg = raw.region && raw.region.width ? raw.region : null;
  const baseW = reg ? reg.width : a.w, baseH = reg ? reg.height : a.h;              // 결과 좌표가 가리키는 범위(원본 픽셀)
  const ratio = raw.units === 'ratio';
  const W = ratio ? 1 : +(raw.image && raw.image.width) || baseW, Hh = ratio ? 1 : +(raw.image && raw.image.height) || baseH;
  const sx = img.w / a.w, sy = img.h / a.h;
  const toPaper = (x, y) => ({ x: round1(img.x + ((reg ? reg.x : 0) + x * baseW / W) * sx), y: round1(img.y + ((reg ? reg.y : 0) + y * baseH / Hh) * sy) });
  const toLen = r => r * (baseW / W * sx + baseH / Hh * sy) / 2;

  const cands = [], warnings = [], byId = new Map(), byLabel = new Map();
  let n = 0;
  const ctx = {
    toPaper, toLen, warn: m => warnings.push(m), byId, byLabel, cands,
    add(kind, data, conf, deps = [], src = kind) { const c = { key: 'k' + (++n), kind, data, conf, deps, supported: !!AI_KINDS[kind], src }; cands.push(c); return c; },
    pointAt(o, conf) {   // {x, y} 또는 [x, y] → 새 점 후보
      const x = Array.isArray(o) ? o[0] : o.x, y = Array.isArray(o) ? o[1] : o.y;
      if (!isFinite(+x) || !isFinite(+y)) return null;
      const c = ctx.add('point', { ...toPaper(+x, +y), label: String((!Array.isArray(o) && o.label) || '').trim() }, conf);
      if (c.data.label && !byLabel.has(c.data.label)) byLabel.set(c.data.label, c);
      return c;
    },
    point(r, conf) {     // 점 가리키기: id, 이름, 또는 좌표
      if (r == null) return null;
      if (typeof r === 'string') { const c = byId.get(r) || byLabel.get(r); return c && c.kind === 'point' ? c : null; }
      if (typeof r === 'object') return ctx.pointAt(r, conf);
      return null;
    },
    pair(a, b, conf) {   // 두 점을 잇는 선분 후보 (이미 있으면 그것)
      if (!a || !b || a === b) return null;
      return cands.find(c => c.kind === 'segment' && ((c.data.a === a.key && c.data.b === b.key) || (c.data.a === b.key && c.data.b === a.key)))
        || ctx.add('segment', { a: a.key, b: b.key, dashed: false }, conf, [a.key, b.key]);
    },
    seg(r, conf) {       // 선분 가리키기: id, "AB", ["A","B"], {from, to}
      if (r == null) return null;
      if (typeof r === 'string') {
        const c = byId.get(r); if (c && c.kind === 'segment') return c;
        const m = [...byLabel.keys()].sort((x, y) => y.length - x.length).find(l => r.startsWith(l) && byLabel.has(r.slice(l.length)));
        return m ? ctx.pair(byLabel.get(m), byLabel.get(r.slice(m.length)), conf) : null;
      }
      if (Array.isArray(r) && r.length === 2) return ctx.pair(ctx.point(r[0], conf), ctx.point(r[1], conf), conf);
      if (typeof r === 'object') return ctx.pair(ctx.point(r.from ?? r.start, conf), ctx.point(r.to ?? r.end, conf), conf);
      return null;
    },
  };
  const items = list.map((o, i) => {
    const t = AI_TYPE_ALIAS[String((o && (o.type || o.kind)) || '').toLowerCase().replace(/[^a-z]/g, '')];
    return { o: o || {}, i, t, stage: t in AI_STAGE ? AI_STAGE[t] : 3 };
  }).sort((p, q) => p.stage - q.stage || p.i - q.i);
  for (const { o, i, t } of items) {
    const conf = clamp(isFinite(+(o.confidence ?? o.conf ?? o.score)) ? +(o.confidence ?? o.conf ?? o.score) : 1, 0, 1);
    const parse = t && AI_PARSERS[t];
    if (!parse) { ctx.add('unsupported', { type: String(o.type || o.kind || '알 수 없음') }, conf, [], o.type); continue; }
    const made = parse(o, conf, ctx);
    if (made && o.id != null) byId.set(String(o.id), made);
    if (!made && made !== false) warnings.push(`${i + 1}번째 항목(${o.type})은 필요한 정보가 없어서 건너뛰었어요.`);
  }
  return { imageId: img.id, cands, warnings };
}
/* 결과 종류별 읽는 방법 (후보를 돌려줌, false = 일부러 만들지 않음, null = 정보 부족) */
const AI_PARSERS = {
  point(o, conf, ctx) {   // 이름(label)이 비어 있고 id가 'A', 'B1' 같은 모양이면 그것을 이름으로
    const label = o.label || o.name || (/^[A-Z][0-9']*$/.test(String(o.id ?? '')) ? String(o.id) : '');
    return ctx.pointAt({ x: o.x, y: o.y, label }, conf);
  },
  label(o, conf, ctx) {   // 떨어져 있는 점 이름 글자 → 가장 가까운 이름 없는 점의 이름으로
    const text = String(o.text ?? o.label ?? '').trim(); if (!text || !isFinite(+o.x) || !isFinite(+o.y)) return null;
    const p = ctx.toPaper(+o.x, +o.y);
    const near = ctx.cands.filter(c => c.kind === 'point' && !c.data.label).map(c => [c, V.dist(c.data, p)])
      .filter(([, d]) => d <= CONFIG.ai.labelAttach).sort((x, y) => x[1] - y[1])[0];
    if (near) { near[0].data.label = text; if (!ctx.byLabel.has(text)) ctx.byLabel.set(text, near[0]); return false; }
    return AI_PARSERS.text(o, conf, ctx);
  },
  segment(o, conf, ctx) {
    const pts = o.points || o.endpoints;
    const s = ctx.seg(Array.isArray(pts) ? pts : { from: o.from ?? o.start ?? o.p1, to: o.to ?? o.end ?? o.p2 }, conf);
    if (s) {
      s.conf = Math.min(s.conf, conf);
      if (o.dashed || /dash|dot/.test(String(o.style || ''))) s.data.dashed = true;
      if (+o.ticks >= 1) s.data.ticks = clamp(Math.round(+o.ticks), 1, 3);   // 같은 길이 표시 | || |||
      if (['end', 'start', 'both'].includes(o.heads)) {   // 끝 모양: 같은 선분을 반대 순서로 적었으면 방향도 바꿔요
        const fromRef = Array.isArray(pts) ? pts[0] : (o.from ?? o.start ?? o.p1);
        const fc = typeof fromRef === 'string' ? ctx.point(fromRef, conf) : null;   // 좌표로 적었으면 방금 만든 순서 그대로
        const flip = !!fc && s.data.a !== fc.key;
        s.data.heads = flip && o.heads !== 'both' ? (o.heads === 'end' ? 'start' : 'end') : o.heads;
      }
    }
    return s;
  },
  line: (o, conf, ctx) => AI_PARSERS._line(o, conf, ctx, false),
  ray: (o, conf, ctx) => AI_PARSERS._line(o, conf, ctx, true),
  _line(o, conf, ctx, ray) {
    const th = Array.isArray(o.through) ? o.through : [o.from ?? o.p1, o.through ?? o.to ?? o.p2];
    const a = ctx.point(th[0], conf), b = ctx.point(th[1], conf); if (!a || !b || a === b) return null;
    return ctx.add('line', { a: a.key, b: b.key, ray, dashed: !!o.dashed || /dash|dot/.test(String(o.style || '')) }, conf, [a.key, b.key], ray ? 'ray' : 'line');
  },
  polygon(o, conf, ctx) {   // 삼각형·사각형: 변마다 선분 후보, 색칠이면 다각형 후보도
    const pts = (o.points || o.vertices || []).map(r => ctx.point(r, conf));
    if (pts.length < 3 || pts.some(p => !p)) return null;
    pts.forEach((p, i) => ctx.pair(p, pts[(i + 1) % pts.length], conf));
    return o.fill ? ctx.add('polygon', { pts: pts.map(p => p.key) }, conf, pts.map(p => p.key)) : false;
  },
  circle(o, conf, ctx) {
    const c = ctx.point(o.center, conf); if (!c) return null;
    const p = ctx.point(o.through, conf);
    const dashed = !!o.dashed;
    if (p && p !== c) return ctx.add('circle', { c: c.key, p: p.key, dashed }, conf, [c.key, p.key]);
    if (+o.radius > 0) return ctx.add('circle', { c: c.key, r: round1(ctx.toLen(+o.radius)), dashed }, conf, [c.key]);
    return null;
  },
  arc(o, conf, ctx) {   // 중심, 시작점, 끝점 (화면에서 시계 반대 방향)
    const c = ctx.point(o.center, conf), a = ctx.point(o.from, conf), b = ctx.point(o.to, conf);
    if (!c || !a || !b || a === c || b === c) return null;
    return ctx.add('arc', { c: c.key, a: a.key, b: b.key }, conf, [c.key, a.key, b.key]);
  },
  angle: (o, conf, ctx) => AI_PARSERS._corner(o, conf, ctx, 'angle'),
  right: (o, conf, ctx) => AI_PARSERS._corner(o, conf, ctx, 'right'),
  _corner(o, conf, ctx, kind) {
    const ps = Array.isArray(o.points) ? o.points : [o.from ?? o.p1, o.vertex, o.to ?? o.p2];
    const [a, v, b] = ps.map(r => ctx.point(r, conf)); if (!a || !v || !b || a === v || b === v) return null;
    const value = o.value ?? o.label ?? o.text;
    return ctx.add(kind, { a: a.key, v: v.key, b: b.key, label: value == null ? '' : String(value).trim() }, conf, [a.key, v.key, b.key]);
  },
  parallel: (o, conf, ctx) => AI_PARSERS._twoSegs(o, conf, ctx, 'parallel'),
  perp: (o, conf, ctx) => AI_PARSERS._twoSegs(o, conf, ctx, 'perp'),
  _twoSegs(o, conf, ctx, kind) {
    const ss = (o.segments || o.lines || []).map(r => ctx.seg(r, conf)); if (ss.length !== 2 || !ss[0] || !ss[1] || ss[0] === ss[1]) return null;
    const dup = ctx.cands.find(c => c.kind === kind && [c.data.s1, c.data.s2].sort().join() === [ss[0].key, ss[1].key].sort().join());
    if (dup) return dup;   // 같은 표시를 두 번 알려 주면 하나로
    return ctx.add(kind, { s1: ss[0].key, s2: ss[1].key, count: clamp(Math.round(+o.count || 1), 1, 3) }, conf, [ss[0].key, ss[1].key]);
  },
  length: (o, conf, ctx) => AI_PARSERS._len(o, conf, ctx, false),
  dimension: (o, conf, ctx) => AI_PARSERS._len(o, conf, ctx, true),
  _len(o, conf, ctx, brace) {
    const s = ctx.seg(o.segment ?? o.between ?? o.points, conf), value = String(o.value ?? o.text ?? '').trim();
    if (!s || !value) return null;
    return ctx.add('length', { seg: s.key, value, brace }, conf, [s.key], brace ? 'dimension' : 'length');
  },
  arrow(o, conf, ctx) {   // from/to: 좌표 [x, y]·{x, y} 또는 점 이름 (점 이름이면 그 점 자리에서 시작·끝)
    const at = r => {
      if (typeof r === 'string') { const c = ctx.byId.get(r) || ctx.byLabel.get(r); return c && c.kind === 'point' ? { x: c.data.x, y: c.data.y, key: c.key } : null; }
      const x = Array.isArray(r) ? r[0] : r && r.x, y = Array.isArray(r) ? r[1] : r && r.y;
      return isFinite(+x) && isFinite(+y) && x !== null && y !== null ? ctx.toPaper(+x, +y) : null;
    };
    const a = at(o.from ?? o.start ?? o.tail), b = at(o.to ?? o.end ?? o.head);
    if (!a || !b || V.dist(a, b) < 1) return null;
    const both = /double/i.test(String(o.type)) || o.both === true || o.heads === 'both';
    return ctx.add('arrow', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, a: a.key || null, b: b.key || null, both, dashed: !!o.dashed || /dash|dot/.test(String(o.style || '')) },
      conf, [a.key, b.key].filter(Boolean));   // 점 이름으로 가리킨 끝은 그 점에 붙어요
  },
  text(o, conf, ctx) {
    const text = String(o.text ?? o.value ?? o.label ?? '').trim(); if (!text || !isFinite(+o.x) || !isFinite(+o.y)) return null;
    const fs = +(o.fontSize || o.size);
    return ctx.add('text', { ...ctx.toPaper(+o.x, +o.y), text, size: fs > 0 ? clamp(Math.round(ctx.toLen(fs)), CONFIG.text.sizeMin, CONFIG.text.sizeMax) : null }, conf);
  },
};

/* ---------- 후보 → 실제 개체: 직접 그릴 때와 같은 add…() 함수를 씁니다 ----------
   create(data, id): id(후보 key) → 이미 만든 개체 id. 만든(또는 그대로 쓴) 개체 id를 돌려줘요. */
const AI_KINDS = {
  point: {
    group: '점', order: 0,
    title: (d) => '점 ' + (d.label || '(이름 없음 → 자동)'),
    create(d) {
      const near = byType('point').filter(p => isPt(p) && !p.def && V.dist(p, d) <= CONFIG.ai.mergeDist).sort((p, q) => V.dist(p, d) - V.dist(q, d))[0];
      if (near) return near.id;   // 같은 자리에 이미 점이 있으면 그 점을 써요 (다시 인식해도 겹치지 않게)
      const p = addPoint(d.x, d.y);
      if (d.label) p.name = d.label;
      return p.id;
    },
  },
  segment: {
    group: '선', order: 1,
    title: (d, L) => (d.dashed ? '점선 ' : '선분 ') + L(d.a) + L(d.b) + ({ end: ` (${L(d.a)}→${L(d.b)})`, start: ` (${L(d.b)}→${L(d.a)})`, both: ' (↔)' }[d.heads] || '') + (d.ticks ? ' ' + '|'.repeat(d.ticks) : ''),
    create(d, id) {
      const a = id(d.a), b = id(d.b); if (!a || !b || a === b) return null;
      const ex = byType('segment').find(s => (s.p1 === a && s.p2 === b) || (s.p1 === b && s.p2 === a));
      if (ex) return ex.id;
      const s = addSegment(a, b); if (d.dashed) s.dashed = true; if (d.heads) s.heads = d.heads; if (d.ticks) s.ticks = d.ticks;
      return s.id;
    },
  },
  line: {
    group: '선', order: 1,
    title: (d, L) => (d.ray ? '반직선 ' : '직선 ') + L(d.a) + L(d.b),
    create(d, id) {
      const a = id(d.a), b = id(d.b); if (!a || !b || a === b) return null;
      const ex = byType('line').find(l => l.def.kind === 'two' && !!l.ray === d.ray && l.def.p1 === a && l.def.p2 === b);
      if (ex) return ex.id;
      const l = addLine({ kind: 'two', p1: a, p2: b }, d.ray); if (d.dashed) l.dashed = true;
      return l.id;
    },
  },
  circle: {
    group: '원', order: 1,
    title: (d, L) => `원 (중심 ${L(d.c)}${d.p ? ', ' + L(d.p) + ' 지남' : ''})`,
    create(d, id) {
      const c = id(d.c); if (!c) return null;
      const o = d.p ? (id(d.p) && id(d.p) !== c ? addCircle({ kind: 'cp', c, p: id(d.p) }) : null) : d.r > 0 ? addCircle({ kind: 'cr', c, r: d.r }) : null;
      if (o && d.dashed) o.dashed = true;
      return o ? o.id : null;
    },
  },
  arc: {
    group: '원', order: 1,
    title: (d, L) => `호 ${L(d.a)}${L(d.b)} (중심 ${L(d.c)})`,
    create(d, id) { const [c, a, b] = [id(d.c), id(d.a), id(d.b)]; return c && a && b ? addArc(c, a, b, false).id : null; },
  },
  polygon: {
    group: '선', order: 2,
    title: (d, L) => '색칠한 다각형 ' + d.pts.map(L).join(''),
    create(d, id) { const ids = d.pts.map(id); return ids.every(Boolean) ? addPolygon(ids).id : null; },
  },
  angle: {
    group: '각·표시', order: 3,
    title: (d, L) => `각 ∠${L(d.a)}${L(d.v)}${L(d.b)}` + (d.label ? ` = ${d.label}` : ''),
    create(d, id) {
      const [a, v, b] = [id(d.a), id(d.v), id(d.b)]; if (!a || !v || !b) return null;
      const ex = byType('angle').find(o => o.vertex === v && ((o.p1 === a && o.p2 === b) || (o.p1 === b && o.p2 === a)));
      if (ex) return ex.id;
      const o = addAngle(a, v, b);
      if (d.label) { o.labelMode = 'custom'; o.label = d.label; }   // 그림에 적힌 글자 그대로 (예: 60°, x)
      return o.id;
    },
  },
  right: {
    group: '각·표시', order: 3,
    title: (d, L) => `직각 표시 ∠${L(d.a)}${L(d.v)}${L(d.b)}`,
    create(d, id) {
      const [a, v, b] = [id(d.a), id(d.v), id(d.b)]; if (!a || !v || !b) return null;
      const ex = byType('right').find(o => o.vertex === v && ((o.p1 === a && o.p2 === b) || (o.p1 === b && o.p2 === a)));
      return ex ? ex.id : addRight(a, v, b).id;
    },
  },
  parallel: {
    group: '각·표시', order: 3,
    title: (d, L, S2) => `평행 표시 ${S2(d.s1)} ∥ ${S2(d.s2)}`,
    create(d, id) {
      const s1 = id(d.s1), s2 = id(d.s2); if (!s1 || !s2 || s1 === s2) return null;
      const o = addParallel(s1, s2); o.count = d.count || 1;
      return o.id;
    },
  },
  perp: {
    group: '각·표시', order: 3,
    title: (d, L, S2) => `수직 표시 ${S2(d.s1)} ⊥ ${S2(d.s2)}`,
    create(d, id) {
      const e1 = segEnds(getObj(id(d.s1))), e2 = segEnds(getObj(id(d.s2)));
      if (!e1 || !e2 || !lineIntersect(e1[0], e1[1], e2[0], e2[1])) return null;   // 거의 평행하면 수직 표시를 못 넣어요
      return addPerp(id(d.s1), id(d.s2)).id;
    },
  },
  length: {
    group: '숫자·글자', order: 3,
    title: (d, L, S2) => `${d.brace ? '치수선' : '길이'} ${d.value} (선분 ${S2(d.seg)})`,
    create(d, id) {
      const s = id(d.seg); if (!s) return null;
      const ex = byType('length').find(l => l.seg === s); if (ex) return ex.id;
      const o = addLength(s, d.value, 'value');
      const side = o.offset >= 0 ? 1 : -1;
      o.style = d.brace ? 'brace' : 'plain';
      o.offset = side * (d.brace ? CONFIG.length.braceDepth : CONFIG.length.gap);
      return o.id;
    },
  },
  arrow: {
    group: '선', order: 3,
    title: (d) => '화살표 ' + (d.both ? '↔' : '→'),
    create(d, id) {
      const p1 = d.a ? id(d.a) : null, p2 = d.b ? id(d.b) : null;
      const o = addArrow(d.x1, d.y1, d.x2, d.y2, p1, p2 !== p1 ? p2 : null);
      o.heads = d.both ? 'both' : 'end'; if (d.dashed) o.dashed = true;
      return o.id;
    },
  },
  text: {
    group: '숫자·글자', order: 4,
    title: (d) => `문자 “${d.text}”`,
    create(d) { const t = addText(d.x, d.y, d.text); if (d.size) t.size = d.size; return t.id; },
  },
};
const AI_GROUP_ORDER = ['점', '선', '원', '각·표시', '숫자·글자', '아직 만들 수 없는 것'];

/* 후보 하나의 이름 (검토 창에 보여 줄 말) */
function aiCandTitle(c, norm) {
  if (!c.supported) return `${c.data.type} — 아직 편집기에서 만들 수 없는 종류예요`;
  const map = norm.map || (norm.map = new Map(norm.cands.map(x => [x.key, x])));
  const L = key => { const p = map.get(key); return (p && p.data.label) || '?'; };
  const S2 = key => { const s = map.get(key); return s ? L(s.data.a) + L(s.data.b) : '?'; };
  return AI_KINDS[c.kind].title(c.data, L, S2);
}
/* 고른 후보 + 그 후보가 기대는 점·선분 (선분만 골라도 양 끝점은 함께 만들어야 하니까) */
function aiWithDeps(norm, keys) {
  const map = new Map(norm.cands.map(c => [c.key, c])), out = new Set();
  const add = k => { const c = map.get(k); if (!c || !c.supported || out.has(k)) return; out.add(k); c.deps.forEach(add); };
  keys.forEach(add);
  return [...out].map(k => map.get(k));
}
/* 고른 후보를 실제 개체로 만들기 (실행 취소 한 번으로 모두 되돌릴 수 있어요) */
function applyRecognition(norm, keys, opt = {}) {
  const list = aiWithDeps(norm, keys).sort((a, b) => AI_KINDS[a.kind].order - AI_KINDS[b.kind].order);
  if (!list.length) { toast('적용할 항목을 하나 이상 골라 주세요.', 'warn'); return false; }
  const picked = new Set(keys), extra = list.filter(c => !picked.has(c.key)).length;
  record();
  const removed = norm.replaceAi ? removeAiObjects(norm.imageId) : 0;   // [다시 인식]에서 '기존 AI 개체 삭제'를 골랐을 때
  const made = new Map(), fresh = [], skipped = [];
  const id = key => made.get(key) || null;
  for (const c of list) {
    const before = new Set(doc.objects.map(o => o.id));
    let r = null;
    try { r = AI_KINDS[c.kind].create(c.data, id); } catch (err) { console.warn(err); }
    if (r) made.set(c.key, r); else skipped.push(c);
    for (const o of doc.objects) if (!before.has(o.id)) { o.ai = { image: norm.imageId, conf: Math.round(c.conf * 100) / 100 }; fresh.push(o.id); }
  }
  const img = getObj(norm.imageId);
  if (img && opt.lockImage) img.locked = true;
  if (img && opt.dimImage) img.opacity = Math.min(img.opacity, CONFIG.ai.dimOpacity);
  if (tool !== 'select') setTool('select');
  if (fresh.length) selectMany(fresh); else renderAll();
  toast((removed ? `기존 AI 개체를 지우고 ` : '') + `인식한 개체 ${fresh.length}개를 만들었어요.` + (extra ? ` (필요한 점·선분 ${extra}개 포함)` : '')
    + (made.size > fresh.length ? ` 이미 있던 ${made.size - fresh.length}개는 그대로 썼어요.` : '')
    + (skipped.length ? ` ${skipped.length}개는 만들 수 없어서 건너뛰었어요.` : '') + ' 마음에 들지 않으면 Ctrl+Z', fresh.length ? 'ok' : 'warn');
  return true;
}

/* 이 그림에서 인식해 만든 개체(와 거기에 기대는 표시)를 모두 지우기 — 지운 개수 */
function removeAiObjects(imageId) {
  const gone = new Set();
  for (const o of doc.objects) if (o.ai && o.ai.image === imageId) withDependents(o.id).forEach(i => gone.add(i));
  for (const a of byType('arrow')) if (!gone.has(a.id)) bakeArrow(a, ['p1', 'p2'].filter(k => a[k] && gone.has(a[k])));
  doc.objects = doc.objects.filter(o => !gone.has(o.id));
  return gone.size;
}

/* ---------- 화면: [🤖 AI 도형 인식] → (처음이면 설정) → (이미 인식했으면 다시 인식 방법) → 분석 → 검토 ---------- */
function aiStart(img, region = null) {
  if (aiBusy) { toast('AI가 아직 분석하고 있어요. 조금만 기다려 주세요.', 'warn'); return; }
  if (Date.now() - aiLastStart < CONFIG.ai.clickGapSec * 1000) return;   // 빠른 연속 클릭은 무시
  aiLastStart = Date.now();
  const blocked = aiBlocked(); if (blocked) { toast(blocked, 'warn'); return; }
  const old = doc.objects.filter(o => o.ai && o.ai.image === img.id);
  const fail = err => {   // 서버가 비밀번호를 요구하면 설정 창으로
    if (err && (err.code === 'code_required' || err.code === 'bad_code')) { aiSettingsDialog(() => { aiLastStart = 0; aiStart(img, region); }, true, err.message); return; }
    showError(err);
  };
  const go = replace => setTimeout(() => runRecognition(img, 'auto', region, { replace }).catch(fail));   // 이 창이 닫힌 뒤에 시작
  if (!old.length) { go(false); return; }
  openModal({
    title: '🔄 다시 인식할까요?', width: 500,
    body: H('div', {},
      H('p', {}, `이 그림에서 이미 인식한 개체가 ${old.length}개 있어요. 새 결과를 적용할 때 기존 AI 개체를 어떻게 할까요?`),
      H('div', { class: 'info' }, '💡 "삭제하고 다시 인식"은 결과를 적용하는 순간에 지워요. 그 전에 취소하면 그대로 남아요. (AI 개체에 이어 그린 표시도 함께 지워지고, Ctrl+Z로 되돌릴 수 있어요)')),
    buttons: [
      { label: '취소' },
      { label: '기존 개체 유지하고 추가 인식', onClick: () => go(false) },
      { label: '기존 AI 개체 삭제하고 다시 인식', kind: 'primary', onClick: () => go(true) },
    ],
  });
}
/* AI 설정 창: 접속 비밀번호(서버에 정해 둔 값), 좌표 자동 보정, 서버 주소(고급), 연결 시험 */

/* ---------- 영역 골라서 인식: 그림 위를 끌어서 네모로 고르면 그 부분만 AI에게 ---------- */
let regionPick = null;   // { imgId } — 고르는 중일 때
function aiRegionStart(img) {
  if (aiBusy) { toast('AI가 아직 분석하고 있어요. 조금만 기다려 주세요.', 'warn'); return; }
  const blocked = aiBlocked(); if (blocked) { toast(blocked, 'warn'); return; }
  if (tool !== 'select') setTool('select');
  regionPick = { imgId: img.id };
  setTempHint('✂ 그림에서 인식할 부분을 끌어서 네모로 고르세요. (취소: Esc)');
  board.classList.add('picking');
  renderOverlay();
}
function aiRegionCancel() { regionPick = null; board.classList.remove('picking'); tempHint = null; updateHint(); renderOverlay(); }
/* 고른 네모(종이 좌표) → 원본 그림 픽셀 범위 */
function aiRegionFinish(a, b) {
  const img = getObj(regionPick && regionPick.imgId), asset = img && assets[img.asset];
  aiRegionCancel();
  if (!img || !asset) return;
  const x1 = Math.max(Math.min(a.x, b.x), img.x), x2 = Math.min(Math.max(a.x, b.x), img.x + img.w);
  const y1 = Math.max(Math.min(a.y, b.y), img.y), y2 = Math.min(Math.max(a.y, b.y), img.y + img.h);
  const sx = asset.w / img.w, sy = asset.h / img.h;
  const region = { x: Math.round((x1 - img.x) * sx), y: Math.round((y1 - img.y) * sy), width: Math.round((x2 - x1) * sx), height: Math.round((y2 - y1) * sy) };
  if (!(region.width >= 16 && region.height >= 16)) { toast('그림 위에서 조금 더 크게 끌어서 골라 주세요.', 'warn'); return; }
  aiStart(img, region);
}
/* 지금 방식: 다른 AI에게 그림을 보여 주고 받은 결과(JSON)를 붙여 넣기 */

/* 시험용 예시 결과: 원본 그림 비율 기준 직각삼각형 ABC (숫자는 확신도를 낮게) */
function aiSample(img) {
  return { units: 'ratio', objects: [
    { id: 'A', type: 'point', label: 'A', x: 0.25, y: 0.2, confidence: 0.97 },
    { id: 'B', type: 'point', label: 'B', x: 0.25, y: 0.8, confidence: 0.96 },
    { id: 'C', type: 'point', label: 'C', x: 0.75, y: 0.8, confidence: 0.95 },
    { type: 'triangle', points: ['A', 'B', 'C'], confidence: 0.93 },
    { type: 'rightAngle', points: ['A', 'B', 'C'], confidence: 0.88 },
    { type: 'length', segment: ['A', 'B'], value: '5', confidence: 0.45 },
    { type: 'length', segment: ['B', 'C'], value: '7', confidence: 0.5 },
    { type: 'arrow', from: [0.8, 0.3], to: [0.9, 0.3], confidence: 0.4 },
  ] };
}
/* 인식 결과 검토 창: 체크한 것만 만들어요 */
function reviewRecognitionDialog(norm) {
  const on = new Set(norm.cands.filter(c => c.supported && c.conf >= CONFIG.ai.autoCheck).map(c => c.key));
  aiPreview = null;
  const boxes = [];
  const groups = {};
  for (const c of norm.cands) (groups[c.supported ? AI_KINDS[c.kind].group : '아직 만들 수 없는 것'] ||= []).push(c);
  const listEl = H('div', { class: 'ai-list' }, AI_GROUP_ORDER.filter(g => groups[g]).flatMap(g => [
    H('div', { class: 'ai-group' }, g),
    ...groups[g].map(c => {
      const cb = H('input', { type: 'checkbox', checked: on.has(c.key), disabled: !c.supported,
        onchange: e => { e.target.checked ? on.add(c.key) : on.delete(c.key); renderOverlay(); } });
      if (c.supported) boxes.push([c.key, cb]);
      const low = c.conf < CONFIG.ai.autoCheck;
      return H('label', { class: 'ai-row' + (c.supported ? '' : ' off'),
        onmouseenter: () => { if (aiPreview) { aiPreview.hot = c.key; renderOverlay(); } },
        onmouseleave: () => { if (aiPreview) { aiPreview.hot = null; renderOverlay(); } } },
        cb, H('span', {}, aiCandTitle(c, norm)),
        H('span', { class: 'conf' + (low ? ' low' : ''), title: 'AI가 스스로 매긴 확신도예요. 실제로 맞을 확률을 보장하지 않아요.' }, (low ? '⚠ ' : '') + Math.round(c.conf * 100) + '%'));
    }),
  ]));
  const setAll = v => { for (const [k, cb] of boxes) { cb.checked = v; v ? on.add(k) : on.delete(k); } renderOverlay(); };
  const opt = { lockImage: true, dimImage: true };
  openModal({
    title: '🤖 AI 인식 결과', width: 470, side: true,
    body: H('div', {},
      H('p', {}, `${norm.cands.length}개를 찾았어요. 체크한 것만 고칠 수 있는 개체로 만들어요. 그림 위 주황 점선이 미리보기예요.`),
      H('div', { class: 'ai-sub', style: 'margin:-6px 0 10px' }, '% 는 AI가 스스로 매긴 확신도예요. 실제 정확도를 보장하지 않으니 ⚠ 표시 항목은 특히 그림과 비교해 보세요.'),
      norm.refined ? H('div', { class: 'info', style: 'margin:0 0 8px' }, `📐 좌표 자동 보정: 점 ${norm.refined}개를 그림 속 선이 만나는 곳에 맞췄어요.`) : null,
      norm.replaceAi ? H('div', { class: 'note', style: 'margin:0 0 8px' }, '🔄 적용하면 이 그림의 기존 AI 개체는 지우고 새 결과로 바꿔요.') : null,
      norm.warnings.length ? H('div', { class: 'note', style: 'margin:0 0 8px' }, norm.warnings.slice(0, 4).join(' ') + (norm.warnings.length > 4 ? ` 외 ${norm.warnings.length - 4}개` : '')) : null,
      H('div', { class: 'btn-row', style: 'margin:0' },
        H('button', { class: 'small-btn', onclick: () => setAll(true) }, '☑ 전체 선택'),
        H('button', { class: 'small-btn', onclick: () => setAll(false) }, '☐ 전체 해제')),
      listEl,
      toggle('적용한 뒤 원본 그림 잠그기 (인식한 개체만 고치기 편해요)', opt.lockImage, v => { opt.lockImage = v; }),
      toggle(`적용한 뒤 원본 그림 흐리게 (${Math.round(CONFIG.ai.dimOpacity * 100)}%)`, opt.dimImage, v => { opt.dimImage = v; })),
    buttons: [
      { label: '취소' },
      { label: '선택한 객체 적용', kind: 'primary', onClick: () => applyRecognition(norm, [...on], opt) },
    ],
  });
  aiPreview = { norm, on, hot: null, map: new Map(norm.cands.map(c => [c.key, c])) };

/* 검토 중 미리보기: 체크한 후보를 주황 점선으로 (마우스를 올린 항목은 진하게) */
function drawAiPreview(ov, k) {
  const { norm, on, hot, map } = aiPreview, color = '#f08c2e';
  const pt = key => { const c = map.get(key); return c && c.kind === 'point' ? c.data : null; };
  for (const c of norm.cands) {
    if (!c.supported || (!on.has(c.key) && c.key !== hot)) continue;
    const d = c.data, w = (c.key === hot ? 4.5 : 2.2) * k;
    const st = { fill: 'none', stroke: color, 'stroke-width': w, 'stroke-dasharray': `${6 * k} ${4 * k}`, 'stroke-opacity': on.has(c.key) ? 1 : .5 };
    if (c.kind === 'point') {
      S('circle', { cx: d.x, cy: d.y, r: (c.key === hot ? 8 : 5) * k, fill: color, 'fill-opacity': .85 }, ov);
      if (d.label) { const t = S('text', { x: d.x + 9 * k, y: d.y - 9 * k, fill: color, 'font-size': 18 * k, 'font-weight': 700, 'font-family': CONFIG.mathFont }, ov); t.textContent = d.label; }
    } else if (c.kind === 'arrow') {
      const G = arrowGeom({ x: d.x1, y: d.y1, dx: d.x2 - d.x1, dy: d.y2 - d.y1, heads: d.both ? 'both' : 'end', headSize: CONFIG.arrow.headSize });
      if (G) { S('line', { ...st, x1: G.L1.x, y1: G.L1.y, x2: G.L2.x, y2: G.L2.y }, ov); S('path', { d: G.heads, fill: color, 'fill-opacity': on.has(c.key) ? 1 : .5 }, ov); }
    } else if (c.kind === 'segment' || c.kind === 'line') {
      const a = pt(d.a), b = pt(d.b); if (a && b) S('line', { ...st, x1: a.x, y1: a.y, x2: b.x, y2: b.y }, ov);
    } else if (c.kind === 'polygon') {
      const ps = d.pts.map(pt); if (ps.every(Boolean)) S('polygon', { ...st, fill: color, 'fill-opacity': .12, points: ps.map(p => `${p.x},${p.y}`).join(' ') }, ov);
    } else if (c.kind === 'arc') {
      const G = arcFromPts(pt(d.c), pt(d.a), pt(d.b), false); if (G) S('path', { ...st, d: arcD(G) }, ov);
    } else if (c.kind === 'circle') {
      const C = pt(d.c), p = d.p && pt(d.p), r = p ? V.dist(C, p) : d.r; if (C && r > 0) S('circle', { ...st, cx: C.x, cy: C.y, r }, ov);
    } else if (c.kind === 'angle' || c.kind === 'right') {
      const v = pt(d.v); if (v) S('circle', { ...st, cx: v.x, cy: v.y, r: 16 * k }, ov);
    } else if (c.kind === 'length' || c.kind === 'text') {
      const s = c.kind === 'length' ? map.get(d.seg) : null;
      const p = s ? (() => { const a = pt(s.data.a), b = pt(s.data.b); return a && b ? V.lerp(a, b, .5) : null; })() : d;
      if (p) { const t = S('text', { x: p.x, y: p.y, fill: color, 'font-size': 18 * k, 'font-weight': 700, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-family': CONFIG.mathFont, stroke: '#fff', 'stroke-width': 3 * k, 'paint-order': 'stroke' }, ov); t.textContent = c.kind === 'length' ? d.value : d.text; }
    }
  }
}

/* ================================================================
   [새 작업 · 작업 저장 · 작업 열기]
   저장 파일(.json)에는 그림과 점·선·표시가 모두 들어 있어 나중에 다시 고칠 수 있어요.
   크롬·엣지에서는 저장할 위치와 이름을 고를 수 있고, 다음부터는 Ctrl+S로 같은 파일에 덮어써요.
   ================================================================ */
function newWork() {
  if (!doc.objects.length && !coordOn()) { toast('이미 빈 작업이에요.'); return; }
  confirmBox('새 작업을 시작할까요?', '지금 그린 내용이 모두 지워져요. (실수했다면 실행 취소로 되돌릴 수 있어요)', '새로 시작', () => {
    record(); doc = emptyDoc(); selectedId = null; multiSel = []; picks = [];
    workName = '이름 없는 작업'; fileHandle = null; markSaved(); store.del('autosave');
    renderAll(); toast('새 작업을 시작했어요.', 'ok');
  }, 'danger');
}
function projectData() {
  const used = new Set(byType('image').map(o => o.asset));
  return { app: 'math-geo-editor', version: 4, name: workName, savedAt: new Date().toISOString(), paper: CONFIG.paper,
    doc, assets: Object.fromEntries([...used].filter(k => assets[k]).map(k => [k, assets[k]])) };
}
const canPickFiles = () => typeof window.showSaveFilePicker === 'function';
async function saveProject(asNew = false) {
  const blob = new Blob([JSON.stringify(projectData())], { type: 'application/json' });
  if (canPickFiles()) {
    try {
      if (!fileHandle || asNew) {
        fileHandle = await window.showSaveFilePicker({ suggestedName: workName + '.json',
          types: [{ description: '도형 작업 파일', accept: { 'application/json': ['.json'] } }] });
        workName = fileHandle.name.replace(/\.json$/i, '');
      }
      const w = await fileHandle.createWritable(); await w.write(blob); await w.close();
      markSaved();
      toast(`"${fileHandle.name}"에 저장했어요. 다음부터는 Ctrl+S 한 번이면 같은 파일에 저장돼요.`, 'ok');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // 저장 창에서 [취소]를 누른 경우
      fileHandle = null;                              // 파일 저장이 막혀 있으면 다운로드로 대신 저장
    }
  }

  markSaved();
  toast(`"${workName}.json" 파일로 저장했어요. (다운로드 폴더) 나중에 [작업 열기]로 다시 고칠 수 있어요.`, 'ok');
}
async function openProject() {

      const [h] = await window.showOpenFilePicker({ types: [{ description: '도형 작업 파일 또는 도형 PNG', accept: { 'application/json': ['.json'], 'image/png': ['.png'] } }] });

}
function openProjectText(text, fileName, handle = null) {

function openProjectData(data, fileName, handle = null) {

/* ---------- 자동 저장: 바뀐 뒤 잠시 후 브라우저에 보관 → 창이 닫혀도 다음에 이어서 ---------- */
let autosaveTimer = null, autosaveWarned = false;
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    if (!doc.objects.length && !coordOn()) { store.del('autosave'); return; }
    const data = projectData();
    if (store.set('autosave', data)) return;
    // 그림이 너무 커서 브라우저 보관함에 안 들어가면 그림 없이라도 보관
    if (store.set('autosave', { ...data, assets: {}, noImages: true }) && !autosaveWarned) {
      autosaveWarned = true;
      toast('그림이 커서 자동 보관에서는 빠졌어요. [저장]으로 파일에 저장해 두세요.', 'warn');
    }
  }, 1200);
}
function offerRecovery() {
  const data = store.get('autosave');
  if (!data || !data.doc || !(data.doc.objects || []).length) return;
  const when = data.savedAt ? new Date(data.savedAt).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  openModal({
    title: '지난번 작업이 남아 있어요',
    body: H('div', {},
      H('p', {}, `"${data.name || '이름 없는 작업'}" (${when}, 개체 ${data.doc.objects.length}개)`),

      data.noImages ? H('div', { class: 'note', style: 'margin:0' }, '배경 그림은 크기가 커서 보관되지 않았어요. 점·선·표시만 돌아와요.') : null),
    buttons: [
      { label: '새로 시작', onClick: () => store.del('autosave') },
      { label: '이어서 하기', kind: 'primary', onClick: () => {
        openProjectData(data, null);
        hist.undo = []; hist.redo = []; updateUndoButtons();
        markDirty();   // 파일로는 아직 저장되지 않은 상태
      } },

  });
}

/* ---------- PNG 안에 작업 정보 넣기 / 꺼내기 ----------
   PNG 파일의 'tEXt' 칸에 작업 내용을 넣어 두면, 그 PNG를 다시 열었을 때 점·선을 고칠 수 있어요.
   (한글·PPT에 넣은 그림에는 영향이 없어요) */
const PNG_KEY = 'GeoEditorProject';
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToUtf8(b64) { return new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))); }
async function pngWithProject(blob) {
  const png = new Uint8Array(await blob.arrayBuffer());
  const body = new TextEncoder().encode(PNG_KEY + '\0' + utf8ToBase64(JSON.stringify(projectData())));
  const chunk = new Uint8Array(12 + body.length), dv = new DataView(chunk.buffer);
  dv.setUint32(0, body.length);
  chunk.set([0x74, 0x45, 0x58, 0x74], 4);   // 'tEXt'
  chunk.set(body, 8);
  dv.setUint32(8 + body.length, crc32(chunk.subarray(4, 8 + body.length)));
  const iend = png.length - 12;               // 마지막 IEND 칸 바로 앞에 넣습니다
  const out = new Uint8Array(png.length + chunk.length);
  out.set(png.subarray(0, iend), 0); out.set(chunk, iend); out.set(png.subarray(iend), iend + chunk.length);
  return new Blob([out], { type: 'image/png' });
}
async function readProjectFromPng(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
    let i = 8;
    while (i + 8 <= buf.length) {
      const len = dv.getUint32(i), type = String.fromCharCode(...buf.subarray(i + 4, i + 8));
      if (type === 'tEXt') {
        const txt = new TextDecoder('latin1').decode(buf.subarray(i + 8, i + 8 + len));
        if (txt.startsWith(PNG_KEY + '\0')) return JSON.parse(base64ToUtf8(txt.slice(PNG_KEY.length + 1)));
      }
      if (type === 'IEND') break;
      i += 12 + len;
    }
  } catch (_) {}
  return null;
}

/* 그림 파일 불러오기: 이 프로그램이 만든 PNG면 '고칠 수 있게 열기'를 먼저 물어봐요 */
async function loadImageFile(file, fromOpen = false) {
  if (!file) return;
  if (file.type === 'image/png') {
    const data = await readProjectFromPng(file);
    if (data) {
      if (fromOpen) { openProjectData(data, file.name); return; }
      openModal({
        title: '도형 편집기로 만든 그림이에요',
        body: H('p', {}, '이 PNG에는 작업 정보가 들어 있어요. 점·선·표시를 다시 고칠 수 있게 열까요?'),
        buttons: [
          { label: '그림으로만 넣기', onClick: () => insertImageFile(file) },
          { label: '고칠 수 있게 열기', kind: 'primary', onClick: () => openProjectData(data, file.name) },
        ],
      });
      return;
    }
    if (fromOpen) toast('이 PNG에는 작업 정보가 없어서 배경 그림으로 넣었어요.');
  } else if (fromOpen) {
    toast('작업 파일(.json)이나 이 프로그램에서 만든 PNG를 골라 주세요. 일반 그림은 [그림 불러오기]를 쓰세요.', 'warn');
    return;
  }
  insertImageFile(file);
}

/* ================================================================
   [PNG 내보내기]
   화면의 선택 표시·손잡이는 빼고, 숨긴 개체도 빼고 저장합니다.
   ================================================================ */
const exportOpt = { area: 'full', includeImages: true, background: 'white', scale: CONFIG.export.scale, embed: true };

function buildExportSvg(opt) {
  const root = S('svg', { xmlns: SVGNS });
  const content = S('g', {}, root);
  drawScene(content, 'export', opt);
  let box = { x: 0, y: 0, width: CONFIG.paper.width, height: CONFIG.paper.height };
  if (opt.area === 'fit') {
    // 그려진 내용의 범위를 재기 위해 잠깐 화면 밖에 붙였다 뗍니다
    root.setAttribute('style', 'position:absolute;left:-99999px;top:0;visibility:hidden');
    document.body.appendChild(root);
    // 좌표평면은 종이 전체를 덮으므로 범위를 잴 때는 빼고, 도형 주변만 잘라냅니다
    const cl = content.querySelector('.coord-layer'), next = cl && cl.nextSibling;
    if (cl && doc.objects.length) cl.remove();
    const b = content.getBBox();
    if (cl && !cl.parentNode) content.insertBefore(cl, next);
    root.remove(); root.removeAttribute('style');
    if (!b.width && !b.height) return null;
    const pad = CONFIG.export.padding;
    box = { x: Math.floor(b.x - pad), y: Math.floor(b.y - pad), width: Math.ceil(b.width + pad * 2), height: Math.ceil(b.height + pad * 2) };
  }
  root.setAttribute('viewBox', `${box.x} ${box.y} ${box.width} ${box.height}`);
  root.setAttribute('width', box.width); root.setAttribute('height', box.height);
  if (opt.background === 'white') root.insertBefore(S('rect', { x: box.x, y: box.y, width: box.width, height: box.height, fill: '#fff' }), content);
  return { svg: root, box };
}
async function makePNG(opt) {
  // 좌표평면만 있어도(빈 모눈) 저장할 수 있어요
  const count = doc.objects.filter(o => o.type === 'image' ? opt.includeImages && o.visible !== false : o.visible !== false).length + (coordOn() ? 1 : 0);
  if (!count) throw new UserError('저장할 내용이 없어요. 먼저 그림을 불러오거나 점과 선분을 그려 주세요.');
  const r = buildExportSvg(opt);
  if (!r) throw new UserError('저장할 내용이 없어요.');
  const str = new XMLSerializer().serializeToString(r.svg);
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const im = await loadImg(url);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(r.box.width * opt.scale));
    c.height = Math.max(1, Math.round(r.box.height * opt.scale));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    if (!blob) throw new Error('toBlob failed');
    return { blob, width: c.width, height: c.height };
  } finally { URL.revokeObjectURL(url); }
}

function openExportDialog() {
  const opt = exportOpt;
  const previewImg = H('img', { alt: '미리보기' });
  const previewBox = H('div', { class: 'preview' }, previewImg);
  const sizeText = H('div', { class: 'preview-size' }, '');
  let lastUrl = null;
  async function refresh() {
    try {
      const { blob, width, height } = await makePNG(opt);
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      previewImg.src = lastUrl; previewImg.style.display = '';
      sizeText.textContent = `저장될 크기: ${width} × ${height} 픽셀`;
    } catch (err) {
      previewImg.style.display = 'none';

    }
  }
  const upd = (k) => v => { opt[k] = v; refresh(); };
  const body = H('div', {},
    previewBox, sizeText,
    field('저장 범위', segmented([['full', '전체 작업 영역'], ['fit', '도형 부분만']], opt.area, upd('area'))),
    toggle('배경 그림 포함', opt.includeImages, upd('includeImages')),
    field('바탕', segmented([['white', '흰색'], ['transparent', '투명']], opt.background, upd('background'))),
    field('선명도', segmented([[1, '보통'], [2, '선명 (추천)'], [3, '아주 선명']], opt.scale, upd('scale'))),
    toggle('나중에 다시 고칠 수 있게 작업 정보 넣기 (추천)', opt.embed, v => { opt.embed = v; }),
    H('p', { style: 'font-size:12.5px;color:var(--muted);margin:4px 0 0' }, '💡 한글(HWP)·PPT에 바로 넣으려면 [클립보드에 복사] 후 Ctrl+V 하세요.'));
  openModal({ title: 'PNG 이미지로 내보내기', body, width: 470, buttons: [

      const { blob } = await makePNG(opt);
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); }
      catch (_) { throw new UserError('이 브라우저에서는 클립보드 복사가 막혀 있어요. [PNG 파일 저장]을 이용해 주세요.'); }
      toast('그림을 복사했어요. 한글·PPT에서 Ctrl+V로 붙여 넣으세요.', 'ok');
    } },
    { label: 'PNG 파일 저장', kind: 'primary', onClick: async () => {
      let { blob } = await makePNG(opt);
      if (opt.embed) blob = await pngWithProject(blob);   // 이 PNG를 [작업 열기]로 열면 다시 고칠 수 있어요
      const name = (workName === '이름 없는 작업' ? '도형' : workName) + '_' + stamp() + '.png';
      if (canPickFiles()) {
        try {
          const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'PNG 그림', accept: { 'image/png': ['.png'] } }] });
          const w = await h.createWritable(); await w.write(blob); await w.close();
          toast(`"${h.name}"으로 저장했어요.` + (opt.embed ? ' 이 PNG를 [작업 열기]로 열면 다시 고칠 수 있어요.' : ''), 'ok');
          return;
        } catch (err) { if (err && err.name === 'AbortError') return false; }
      }
      downloadBlob(blob, name);
      toast('PNG 파일로 저장했어요. (다운로드 폴더)' + (opt.embed ? ' 이 PNG를 [작업 열기]로 열면 다시 고칠 수 있어요.' : ''), 'ok');
    } },
  ] });
  refresh();
}

/* ================================================================
   [단축키]
   ================================================================ */
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const typing = /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && !['range', 'checkbox', 'color'].includes(ae.type);
  const ctrl = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (modalEl) {
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'Enter' && !e.isComposing && ae.tagName === 'INPUT') {   // 한글 조합 중 Enter는 무시
      e.preventDefault();
      const p = modalEl.querySelector('.m-btn.primary'); if (p) p.click();
    }
    return;
  }
  if (ctrl && key === 's') { e.preventDefault(); saveProject(e.shiftKey); return; }   // Shift까지 누르면 다른 이름으로
  if (ctrl && key === 'o') { e.preventDefault(); openProject(); return; }
  if (typing) return;
  if (ctrl && key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (ctrl && (key === '=' || key === '+')) { e.preventDefault(); zoomTo(view.scale * CONFIG.zoom.step); return; }
  if (ctrl && key === '-') { e.preventDefault(); zoomTo(view.scale / CONFIG.zoom.step); return; }
  if (ctrl && key === '0') { e.preventDefault(); zoomFit(); return; }
  if (ctrl && key === 'a') { e.preventDefault(); selectAll(); return; }
  if (ctrl && key === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; wrap.classList.add('panning'); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
  if (e.key === 'Enter' && tool === 'polygon' && picks.length) { e.preventDefault(); finishPolygon(false); return; }
  if (e.key === 'Escape') {
    if (flyEl) { closeFlyout(); return; }
    if (regionPick) { aiRegionCancel(); toast('영역 고르기를 취소했어요.'); return; }
    if (picks.length) { picks = []; renderAll(); toast('고르던 것을 취소했어요.'); }
    else if (tool !== 'select') setTool('select');
    else select(null);
    return;
  }
  const t = Object.keys(TOOLS).find(n => TOOLS[n].key === key);
  if (t) { setTool(t); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key]) {
    const ids = selectionIds(), one = ids.length === 1 ? getObj(ids[0]) : null;
    if (!ids.length || (one && !('x' in one) && one.type !== 'segment')) return;   // 표시 하나만 골랐을 땐 움직이지 않아요
    e.preventDefault();
    if (one && one.type === 'image' && one.locked) { toast('🔒 잠긴 그림은 움직이지 않아요.', 'warn'); return; }
    if (one && one.type === 'point' && one.def) { toast(`${one.name}은(는) 따라 움직이는 점이라 화살표로 옮길 수 없어요.`, 'warn'); return; }
    const movers = moversFor(ids); if (!movers.length) return;
    // 격자에 맞추는 중이면 점은 한 칸(또는 반 칸)씩 움직입니다
    const gridStep = movers.some(m => m.type === 'point') && coordOn() && doc.coord.snap ? doc.coord.unit * doc.coord.snap : 0;
    const step = gridStep || (e.shiftKey ? 10 : 1);
    record('nudge:' + ids.join(','));
    for (const m of movers) { m.x = round1(m.x + arrows[e.key][0] * step); m.y = round1(m.y + arrows[e.key][1] * step); }
    renderCanvas();
    if (one && one.type === 'point') syncCoordInputs(one);
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; wrap.classList.remove('panning'); } });
window.addEventListener('blur', () => { spaceDown = false; wrap.classList.remove('panning'); });

/* 마우스 휠: 마우스가 있는 곳을 중심으로 확대/축소 */
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTo(view.scale * Math.pow(1.0015, -e.deltaY), toBoard(e));
}, { passive: false });
$('#zoomIn').onclick = () => zoomTo(view.scale * CONFIG.zoom.step);
$('#zoomOut').onclick = () => zoomTo(view.scale / CONFIG.zoom.step);
$('#zoom100').onclick = () => zoomTo(1);
$('#zoomFit').onclick = zoomFit;

/* ================================================================
   [시작]
   ================================================================ */
buildToolbar();
new ResizeObserver(() => { if (LAYER) { applyView(); renderCanvas(); } }).observe(wrap);
setupBoard();
setTool('select');
renderAll();
updateTitle();
offerRecovery();   // 지난번에 저장하지 못한 작업이 있으면 이어서 할지 물어봐요
</script>
</body>
</html>
